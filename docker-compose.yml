services:
  backend:
    build: .
    environment:
      APP_ENV: development
      AI_PROVIDER: fake
      DATABASE_URL: postgresql+asyncpg://mia:mia-local-only@postgres:5432/mia
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${MIA_BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mia
      POSTGRES_USER: mia
      POSTGRES_PASSWORD: mia-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mia -d mia"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
