name: Backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.12"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run mypy app tests
      - run: uv run pytest
      - run: uv run python contracts/scripts/validate_contracts.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.12"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sh ops/security_scan.sh
