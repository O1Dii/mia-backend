[project]
name = "mia-backend"
version = "0.1.0"
description = "MIA backend service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.15.2",
    "asyncpg==0.30.0",
    "fastapi==0.115.12",
    "greenlet==3.2.4",
    "google-genai==1.10.0",
    "httpx==0.28.1",
    "pydantic-settings==2.8.1",
    "redis==5.2.1",
    "sqlalchemy==2.0.40",
    "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
    "mypy==1.15.0",
    "jsonschema==4.25.1",
    "openapi-spec-validator==0.7.2",
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "ruff==0.11.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]
extend-exclude = ["contracts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["redis.*"]
ignore_missing_imports = true
