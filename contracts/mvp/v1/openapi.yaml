        default: *error
  /v1/model-connections/{connection_id}/test:
    parameters: [{$ref: '#/components/parameters/ConnectionId'}]
    post:
      security:
        - bearerAuth: []
        - cookieAuth: []
      tags: [Plugins]
      operationId: testModelConnection
      parameters: [*idem]
      summary: One-token test call, rate limited to one per 5 s per connection
      responses:
        '200':
          description: Result
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [ok, latency_ms, error_code]
                properties:
                  ok: {type: boolean}
                  latency_ms: {type: integer}
                  error_code: {type: [string, 'null']}
        default: *error
  /v1/model-connections/{connection_id}/resume:
    parameters: [{$ref: '#/components/parameters/ConnectionId'}]
    post:
      security:
        - bearerAuth: []
        - cookieAuth: []
      tags: [Plugins]
      operationId: resumeModelConnection
      parameters: [*idem]
      responses:
        '200':
          description: Pause cleared
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelConnection'}
        default: *error
  /v1/model-connections/{connection_id}/sign-out:
    parameters: [{$ref: '#/components/parameters/ConnectionId'}]
    post:
      security:
        - bearerAuth: []
        - cookieAuth: []
      tags: [Plugins]
      operationId: signOutModelConnection
      parameters: [*idem]
      responses:
        '200':
          description: Plan tokens revoked, connection needs_reauth
