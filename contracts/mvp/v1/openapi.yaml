  /v1/devices/{device_id}/tools:
    parameters:
      - {name: device_id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      tags: [Devices]
      operationId: putDeviceTools
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceToolRegistration'}
      responses:
        '204':
          description: Declarations replaced
          headers: *rid
        default: *error
  # --- M70 device access (ADR-0016): only the app signed in on {device_id} (else 403 device_access_forbidden)
  /v1/devices/{device_id}/tool-calls:
    parameters:
      - {name: device_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Devices]
      operationId: listDeviceToolCalls
      summary: Device calls queued for this device by push delivery (M70)
      description: >-
        Calls of runs this device did not start (a browser, another device, the app's WebView)
