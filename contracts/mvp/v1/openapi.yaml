          headers: *rid
        default: *error
  /v1/devices/{device_id}/access-log:
    parameters:
      - {name: device_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Devices]
      operationId: listDeviceAccessLog
      summary: Device reads/actions requested by other clients, newest first (M70)
      parameters:
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: What, from where, when, decision (no results)
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceAccessLog'}
        default: *error
  /v1/devices/{device_id}/capabilities:
    parameters:
      - {name: device_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Devices]
      operationId: listDeviceCapabilities
      summary: Whether other clients may ask for each capability of this device (M70)
      responses:
        '200':
          description: All known capabilities with their setting
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceCapabilitySettingList'}
        default: *error
  /v1/devices/{device_id}/capabilities/{capability}:
    parameters:
      - {name: device_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: capability, in: path, required: true, schema: {type: string, maxLength: 64}}
    put:
      tags: [Devices]
      operationId: putDeviceCapability
      summary: Let other clients ask (ask) or never use (deny) a capability (M70); 404 device_capability_unknown
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceCapabilitySettingRequest'}
      responses:
        '200':
          description: The stored setting
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceCapabilitySetting'}
        default: *error
  /v1/notifications/settings:
    get:
      tags: [Notifications]
      operationId: getNotificationSettings
      summary: Channels (push, Telegram, plugin channels) with their status, switches and the «event type × channel» table (M77)
      responses:
        '200':
          description: The user's notification settings
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationSettings'}
        default: *error
    patch:
      tags: [Notifications]
      operationId: updateNotificationSettings
      summary: Switch channels and table cells (a merge); 422 notification_channel_unknown / notification_event_type_unknown
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateNotificationSettingsRequest'}
      responses:
        '200':
          description: The settings after the change
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationSettings'}
        default: *error
  /v1/telegram/link:
    get:
      tags: [Telegram]
      operationId: getTelegramLink
      summary: Whether the Mia Telegram bot is available and linked to this user (M41)
      responses:
        '200':
          description: Link status
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [available, linked, bot_username, linked_at]
                properties:
                  available: {type: boolean, description: Bot token, username and webhook secret are configured}
                  linked: {type: boolean}
                  bot_username: {type: [string, 'null']}
                  linked_at: {type: [string, 'null'], format: date-time}
        default: *error
    post:
      tags: [Telegram]
      operationId: createTelegramLink
      parameters: [*idem]
      summary: One-time deep link that binds the bot chat to this user (M41; the Idempotency-Key is accepted but a retry issues a new token, older ones expire)
      responses:
        '201':
          description: Open deep_link in Telegram and press Start; the token works once
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [deep_link, bot_username, expires_at]
                properties:
                  deep_link: {type: string, description: 'https://t.me/<bot>?start=<token>'}
                  bot_username: {type: string}
                  expires_at: {type: string, format: date-time}
        default: *error
    delete:
      tags: [Telegram]
      operationId: deleteTelegramLink
      parameters: [*idem]
      summary: Unlink the bot chat (idempotent, M41)
      responses:
        '204':
          description: Unlinked
          headers: *rid
        default: *error
  /webhooks/telegram:
    post:
      tags: [Telegram]
      operationId: telegramWebhook
      summary: Telegram Bot API webhook; authenticated only by the X-Telegram-Bot-Api-Secret-Token header (M41)
      security: []
      parameters:
        - {name: X-Telegram-Bot-Api-Secret-Token, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 256}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, description: Telegram Update}
      responses:
        '200':
          description: Update accepted (also when its handling failed, so Telegram does not retry)
          headers: *rid
          content:
            application/json:
              schema: {type: object, required: [ok], properties: {ok: {type: boolean}}}
        default: *error
  /v1/chat/completions:
    post:
      tags: [Apps]
      operationId: createChatCompletion
      summary: OpenAI-compatible chat completions; model "mia:default" is the user's active model
      description: >-
        Body and response follow the OpenAI Chat Completions format (including
        stream=true SSE). Mia extensions go in extra_body: mia.context,
        mia.tools, mia.budget. OpenAI SDKs do not send Idempotency-Key.
      x-mia-idempotency: exempt
      security:
        - miaOAuth: [llm.generate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model: {type: string, examples: ['mia:default']}
                messages: {type: array, minItems: 1, items: {type: object}}
                stream: {type: boolean}
                stream_options: {type: object}
                tools: {type: array, items: {type: object}}
                mia: {$ref: '#/components/schemas/MiaExtensions'}
      responses:
        '200':
          description: OpenAI-compatible completion or SSE chunks
          headers: *rid
          content:
            application/json:
              schema: {type: object}
            text/event-stream:
              schema: {type: string}
        default: *error
  /.well-known/oauth-authorization-server:
    get:
      tags: [Apps]
      operationId: getAuthorizationServerMetadata
      security: []
      responses:
        '200':
          description: RFC 8414 metadata (client_id_metadata_document_supported true, PKCE S256 only)
          headers: *rid
          content:
            application/json:
              schema: {type: object}
  /oauth/authorize:
    get:
      tags: [Apps]
      operationId: oauthAuthorize
      summary: OAuth 2.1 authorization endpoint; client_id is a Client ID Metadata Document URL
      security: []
      parameters:
        - {name: client_id, in: query, required: true, schema: {type: string, format: uri}}
        - {name: redirect_uri, in: query, required: true, schema: {type: string, format: uri}}
        - {name: response_type, in: query, required: true, schema: {type: string, enum: [code]}}
        - {name: scope, in: query, required: true, schema: {type: string}}
        - {name: state, in: query, required: true, schema: {type: string}}
        - {name: code_challenge, in: query, required: true, schema: {type: string}}
        - {name: code_challenge_method, in: query, required: true, schema: {type: string, enum: [S256]}}
        - {name: resource, in: query, required: false, schema: {type: string, format: uri}}
      responses:
        '302':
          description: Redirect to consent screen or back to redirect_uri
          headers: *rid
  /oauth/token:
    post:
      tags: [Apps]
      operationId: oauthToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id]
              properties:
                grant_type: {type: string, enum: [authorization_code, refresh_token]}
                client_id: {type: string, format: uri}
                code: {type: string}
                code_verifier: {type: string}
                redirect_uri: {type: string}
                refresh_token: {type: string}
      responses:
        '200':
          description: Short-lived access token and rotating refresh token
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, scope]
                properties:
                  access_token: {type: string}
                  token_type: {type: string, enum: [Bearer]}
                  expires_in: {type: integer}
                  refresh_token: {type: string}
                  scope: {type: string}
                  id_token: {type: string, description: ES256 OIDC ID token when openid was granted (M50)}
        '400':
          description: RFC 6749 error
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
                  error_description: {type: string}
  /oauth/revoke:
    post:
      tags: [Apps]
      operationId: oauthRevoke
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
                token_type_hint: {type: string, enum: [access_token, refresh_token]}
      responses:
        '200':
          description: Revoked (always 200 per RFC 7009)
          headers: *rid
  /mcp:
    post:
      tags: [Apps]
      operationId: miaMcpServer
      summary: Mia as a Streamable HTTP MCP server (2026-07-28) for Claude, ChatGPT, Cursor
      security:
        - miaOAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, description: JSON-RPC 2.0 request}
      responses:
        '200':
          description: JSON-RPC response or SSE stream
          headers: *rid
          content:
            application/json:
              schema: {type: object}
            text/event-stream:
              schema: {type: string}
        default: *error
  /v1/responses:
    post:
      tags: [Apps]
      operationId: createResponse
      summary: OpenAI-compatible Responses API; model "mia:default" (M50)
      description: >-
