openapi: 3.1.0
info:
  title: MIA MVP API
  version: 1.0.0-skeleton
  description: >-
    Path skeleton of the MVP public API (ADR-0010..0013, Review §8.2). First-party
    clients (Android, web) and third-party apps use the same API. Request and
    response bodies reference the JSON Schemas next to this file; inline shapes
    are provisional and are refined additively by the session that implements
    each resource (see contracts/mvp/v1/README.md for ownership).
servers:
  - url: https://mia.example.com
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - name: Runs
  - name: Feed
  - name: Chats
  - name: Now
  - name: Approvals
  - name: Plugins
  - name: Memory
  - name: Background
  - name: Notifications
  - name: Devices
  - name: Telegram
  - name: Apps
x-mia-anchors:
  request-id: &rid
    X-Request-ID:
      $ref: '#/components/headers/RequestId'
  idem: &idem
    $ref: '#/components/parameters/IdempotencyKey'
  error: &error
    $ref: '#/components/responses/Error'
paths:
  /v1/runs:
    post:
      tags: [Runs]
      operationId: createRun
      summary: Start a run (voice, chat, job or app profile)
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRunRequest'}
      responses:
        '202':
          description: Run accepted; follow events_url
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        default: *error
  /v1/runs/{run_id}:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    get:
      tags: [Runs]
      operationId: getRun
      responses:
        '200':
          description: Run state
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        default: *error
  /v1/runs/{run_id}/events:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    get:
      tags: [Runs]
      operationId: streamRunEvents
      summary: Server-sent events; each SSE id is the event cursor
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - name: Last-Event-ID
          in: header
          required: false
          schema: {type: string, minLength: 1, maxLength: 512}
      responses:
        '200':
          description: >-
            SSE stream of run events (id = cursor, event = type, data = RunEvent JSON), ends
            after a terminal event. Last-Event-ID wins over ?cursor=. Idle streams carry
            ": keepalive" comments. A cursor of another run is rejected with invalid_cursor.
          headers: *rid
          content:
            text/event-stream:
              schema: {$ref: '#/components/schemas/RunEvent'}
        default: *error
  /v1/runs/{run_id}/cancel:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    post:
      tags: [Runs]
      operationId: cancelRun
      parameters: [*idem]
      responses:
        '202':
          description: Cancellation requested (status cancel_requested); run.cancelled follows on the stream
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        default: *error
  /v1/runs/{run_id}/device-tool-results:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    post:
      tags: [Runs, Devices]
      operationId: submitDeviceToolResult
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceToolResult'}
      responses:
        '204':
          description: Result accepted
          headers: *rid
        default: *error
  /v1/feed:
    get:
      tags: [Feed, Chats]
      operationId: listFeed
      summary: History of one chat (voice and text), newest first; the default chat without conversation_id
      description: >-
        Messages of one chat (ADR-0017, M74). conversation_id selects the chat; without it the
        default chat is read - the user's most recently active chat - so single-feed clients keep
        working, and the page names it in conversation_id (null when the user has no chat yet;
        a read never creates one). Keyset pagination: pass the previous page's next_cursor as
        before to load older messages; new messages are always newer than any cursor already
        issued, so pages never skip or repeat an item. A cursor is bound to its chat. Accepts the
        bearer token (Android) and the HttpOnly mia_session cookie (web, M10). Only the caller's
        own chats are reachable (conversation_not_found); a cursor that is malformed or belongs
        to another chat is rejected with invalid_feed_cursor. Incognito runs never appear.
      parameters:
        - name: before
          in: query
          required: false
          description: Opaque next_cursor of the previous page
          schema: {type: string, minLength: 1, maxLength: 512}
        - {$ref: '#/components/parameters/Limit'}
        - name: conversation_id
          in: query
          required: false
          description: The chat to read (Chat.id); omitted = the default (most recently active) chat
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: A page of feed items, newest first
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeedPage'}
        default: *error
  /v1/chats:
    get:
      tags: [Chats]
      operationId: listChats
      summary: The user's chats, pinned first, then by last activity (M74, ADR-0017)
      description: >-
        Chats of kind chat and telegram (the dialog with the Mia bot). Each chat has its own
        history and model context; memory, plugins, jobs, inbox and approvals are shared by the
        account. Order: pinned chats first, then by last_message_at (created_at for an empty
        chat), newest first. Keyset pagination with cursor/next_cursor (invalid_chat_cursor).
      parameters:
        - name: cursor
          in: query
          required: false
          schema: {type: string, minLength: 1, maxLength: 512}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: A page of chats
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatPage'}
        default: *error
    post:
      tags: [Chats]
      operationId: createChat
      summary: Start a new empty chat (e.g. the side key on Android)
      description: >-
        A replayed Idempotency-Key returns the same chat. Without a title the chat gets a
        provisional title from its first message and then a short title from the user's model
        (title_source auto, then model). Send messages with POST /v1/runs and conversation_id.
        An unpinned chat that never gets a message is removed after 24 hours.
      parameters: [*idem]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateChatRequest'}
      responses:
        '201':
          description: The chat
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Chat'}
        default: *error
  /v1/chats/continue:
    get:
      tags: [Chats]
      operationId: getContinuableChat
      summary: The chat to offer as «Продолжить прошлый» - its last answer is younger than within_seconds
      description: >-
        The most recent chat of kind chat whose last assistant answer (last_assistant_at) is at
        most within_seconds old, or null. Clients call it when the assistant is invoked (side
        key) to offer continuing instead of the new chat.
      parameters:
        - name: within_seconds
          in: query
          required: false
          schema: {type: integer, minimum: 30, maximum: 3600, default: 300}
      responses:
        '200':
          description: The chat to continue, or null
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatContinue'}
        default: *error
  /v1/chats/settings:
    get:
      tags: [Chats]
      operationId: getChatSettings
      summary: Chat retention setting (default 60 days of inactivity)
      responses:
        '200':
          description: Settings
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatSettings'}
        default: *error
    put:
      tags: [Chats]
      operationId: updateChatSettings
      summary: Set chat retention - 30, 60 or 180 days of inactivity, or null (never)
      description: >-
        An unpinned chat is deleted retention_days after its last message (checked hourly).
        Pinned chats are never deleted; deleting chats never deletes Memory.
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateChatSettingsRequest'}
      responses:
        '200':
          description: Settings
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatSettings'}
        default: *error
  /v1/chats/{chat_id}:
    parameters:
      - {name: chat_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Chats]
      operationId: getChat
      responses:
        '200':
          description: The chat
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Chat'}
        default: *error
    patch:
      tags: [Chats]
      operationId: updateChat
      summary: Rename (title; null returns to the automatic title) and/or pin
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateChatRequest'}
      responses:
        '200':
          description: The chat
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Chat'}
        default: *error
    delete:
      tags: [Chats]
      operationId: deleteChat
      summary: Delete the chat and its messages; Memory, jobs and inbox are not touched
      parameters: [*idem]
      responses:
        '204':
          description: Deleted
          headers: *rid
        default: *error
  /v1/now:
    get:
      tags: [Now]
      operationId: getNow
      summary: The «Сейчас» strip - active timers, alarms, focus sessions and background jobs
      description: >-
        Account-wide (all chats). Plugin items come from the stored state of builtin.timer,
        builtin.alarm and builtin.focus (active installations only; expired items are not
        listed), sorted by time left with paused ones after running ones; then active jobs,
        newest first (at most 20). Count down locally from remaining_ms against server_time.
        cancel says how to stop an item without the model.
      responses:
        '200':
          description: Active items
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NowPage'}
        default: *error
  /v1/approvals:
    get:
      tags: [Approvals]
      operationId: listApprovals
      summary: The caller's approvals, newest first (pending by default)
      parameters:
        - name: status
          in: query
          required: false
          schema: {type: string, enum: [pending, approved, denied, expired, cancelled], default: pending}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Approvals of the authenticated user only
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Approval'}}
        default: *error
  /v1/approvals/{approval_id}:
    parameters: [{$ref: '#/components/parameters/ApprovalId'}]
    get:
      tags: [Approvals]
      operationId: getApproval
      responses:
        '200':
          description: Approval with exact arguments
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Approval'}
        default: *error
  /v1/approvals/{approval_id}/decision:
    parameters: [{$ref: '#/components/parameters/ApprovalId'}]
    post:
      tags: [Approvals]
      operationId: decideApproval
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApprovalDecisionRequest'}
      responses:
        '200':
          description: >-
            Decision recorded. 409 approval_args_mismatch / approval_expired /
            approval_already_decided (a retry with the same decision returns 200); 404
            approval_not_found for a missing or foreign approval. Bearer decisions are recorded
            with channel android, same-origin cookie decisions with channel web. M70: an approval
            with device_consent is decided only by the app on its target device (else 403
            approval_device_only); scope persistent needs device_consent.scopes to list it (else
            409 approval_scope_unavailable).
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Approval'}
        default: *error
  /v1/auth/web/nonce:
    post:
      tags: [Plugins]
      operationId: createWebNonce
      summary: Google nonce for web sign-in, bound to the browser by the HttpOnly cookie mia_web_nonce (M10)
      security: []
      parameters: [*idem]
      responses:
        '201':
          description: Nonce issued
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [nonce, expires_at]
                properties:
                  nonce: {type: string}
                  expires_at: {type: string, format: date-time}
        default: *error
  /v1/auth/web/google:
    post:
      tags: [Plugins]
      operationId: webSignInGoogle
      summary: Exchange a Google ID token for the mia_session cookie; the session is never in the body (M10)
      security: []
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [credential]
              properties:
                credential: {type: string, minLength: 1, maxLength: 16384}
      responses:
        '200':
          description: Signed in; Set-Cookie mia_session (HttpOnly, SameSite=Strict)
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [user, expires_at]
                properties:
                  user: {type: object}
                  expires_at: {type: string, format: date-time}
        default: *error
  /v1/auth/web/logout:
    post:
      tags: [Plugins]
      operationId: webLogout
      security:
        - cookieAuth: []
      parameters: [*idem]
      responses:
        '204':
          description: Session closed, cookie cleared
          headers: *rid
        default: *error
  /v1/auth/web/handoff:
    post:
      tags: [Plugins]
      operationId: createWebHandoff
      summary: >-
        Single-use code that signs the Android WebView in with the app's bearer (M24).
        Bearer only (a cookie session gets 403 permission_denied).
      security:
        - bearerAuth: []
      parameters: [*idem]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                path:
                  type: string
                  maxLength: 512
                  description: >-
                    Same-origin landing path bound to the code, for example /store. The first
                    segment must be one of chat, store, installed, models, approvals, dashboard,
                    memory, inbox, data, more; default /chat. Otherwise 400 web_handoff_path_invalid.
      responses:
        '201':
          description: >-
            Code valid for 60 s, redeemable once. Each call (including a retry with the same
            Idempotency-Key) issues a new code; the response is not stored (Cache-Control no-store).
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [code, expires_at, redeem_path]
                properties:
                  code: {type: string}
                  expires_at: {type: string, format: date-time}
                  redeem_path:
                    type: string
                    description: Path (with query) the WebView loads on the web origin.
        default: *error
  /v1/auth/web/handoff/redeem:
    get:
      tags: [Plugins]
      operationId: redeemWebHandoff
      summary: >-
        Consume a hand-off code: Set-Cookie mia_session (HttpOnly, SameSite=Strict) and a 303
        redirect to the path bound to the code (M24). Called by the WebView without credentials.
      security: []
      parameters:
        - {name: code, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 256}}
      responses:
        '303':
          description: Signed in; Location is the same-origin landing path. Never cached.
          headers: *rid
        default: *error
  /v1/workspace:
    get:
      tags: [Plugins]
      operationId: getWorkspace
      summary: The caller's personal workspace (M10)
      responses:
        '200':
          description: Workspace
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        default: *error
  /v1/plugins:
    get:
      tags: [Plugins]
      operationId: listCatalog
      summary: Store catalog, latest published release of every plugin (M15)
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: category, in: query, required: false, schema: {type: string}}
        - {name: query, in: query, required: false, description: 'Substring of name, description or id', schema: {type: string, maxLength: 100}}
      responses:
        '200':
          description: Store catalog entries ordered by name
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/CatalogEntry'}}
                  next_cursor: {type: [string, 'null']}
        default: *error
  /v1/plugins/{plugin_id}:
    parameters: [{$ref: '#/components/parameters/PluginId'}]
    get:
      tags: [Plugins]
      operationId: getCatalogEntry
      parameters:
        - {name: version, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: Catalog entry with the published manifest, all versions and the consent screen
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CatalogEntryDetail'}
        default: *error
  /v1/plugins/{plugin_id}/consent:
    parameters: [{$ref: '#/components/parameters/PluginId'}]
    get:
      tags: [Plugins]
      operationId: getPluginConsent
      summary: Consent screen of a release - tools with risk, data, network, model use, grants
      parameters:
        - {name: version, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: What the user consents to by installing this version
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Consent'}
        default: *error
  /v1/plugins/{plugin_id}/install:
    parameters: [{$ref: '#/components/parameters/PluginId'}]
    post:
      tags: [Plugins]
      operationId: installPlugin
      summary: Install a published release with consent (digest and grants of the consent screen)
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InstallRequest'}
      responses:
        '201':
          description: Installed and pinned to the release; connect the account next if status is needs_connection
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Installation'}
        default: *error
  /v1/plugins/{plugin_id}/reviews:
    parameters: [{$ref: '#/components/parameters/PluginId'}]
    get:
      tags: [Plugins]
      operationId: listPluginReviews
      responses:
        '200':
          description: Reviews, newest first, with the rating summary
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewList'}
        default: *error
  /v1/plugins/{plugin_id}/reviews/me:
    parameters: [{$ref: '#/components/parameters/PluginId'}]
    put:
      tags: [Plugins]
      operationId: putPluginReview
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rating]
              properties:
                rating: {type: integer, minimum: 1, maximum: 5}
                text: {type: string, maxLength: 2000}
      responses:
        '204':
          description: The caller's single review of this plugin is saved
          headers: *rid
        default: *error
    delete:
      tags: [Plugins]
      operationId: deletePluginReview
      parameters: [*idem]
      responses:
        '204':
          description: Review removed
          headers: *rid
        default: *error
  /v1/plugins/{plugin_id}/releases/{version}/files/{path}:
    parameters:
      - {$ref: '#/components/parameters/PluginId'}
      - {name: version, in: path, required: true, schema: {type: string}}
      - {name: path, in: path, required: true, schema: {type: string}}
    get:
      tags: [Plugins]
      operationId: getReleaseFile
      summary: A listing image (icon, screenshot) of a release; nosniff and a sandbox CSP are set
      responses:
        '200':
          description: Image bytes
          headers: *rid
          content:
            image/*:
              schema: {type: string, contentEncoding: base64}
        default: *error
  /v1/installations:
    get:
      tags: [Plugins]
      operationId: listInstallations
      responses:
        '200':
          description: Plugins installed for the current user
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Installation'}}
        default: *error
    post:
      tags: [Plugins]
      operationId: createInstallation
      summary: Install a catalog plugin by digest, or add a custom MCP server by URL (own account only)
      description: >-
        Catalog installs through this operation pin the release digest only; the consented
        grants are recorded by POST /v1/plugins/{plugin_id}/install, which the clients use.
        A custom MCP URL answers needs_consent: probe it with GET
        /v1/installations/{id}/discovery, connect the account when asked, then consent with
        POST /v1/installations/{id}/consent.
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateInstallationRequest'}
      responses:
        '201':
          description: Installed; connect the account next if the server needs OAuth
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Installation'}
        default: *error
  /v1/installations/{installation_id}:
    parameters: [{$ref: '#/components/parameters/InstallationId'}]
    get:
      tags: [Plugins]
      operationId: getInstallation
      responses:
        '200':
          description: Installation
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Installation'}
        default: *error
    patch:
      tags: [Plugins]
      operationId: updateInstallation
      summary: Enable or disable an installation (compare-and-swap on state_version)
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version]
              properties:
                expected_version: {type: integer, minimum: 0}
                status: {type: string, enum: [active, needs_connection, needs_consent, disabled]}
                grants: {type: array, maxItems: 64, items: {type: string}}
      responses:
        '200':
          description: Updated; 409 version_conflict (details.current_version) when expected_version is stale
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Installation'}
        default: *error
    delete:
      tags: [Plugins]
      operationId: deleteInstallation
      summary: Uninstall; the connection's tokens are revoked at the provider first
      parameters:
        - *idem
        - {name: delete_data, in: query, required: false, schema: {type: boolean, default: false}}
      responses:
        '204':
          description: Uninstalled; tokens revoked and tiles removed
          headers: *rid
        default: *error
  /v1/installations/{installation_id}/state:
    parameters: [{$ref: '#/components/parameters/InstallationId'}]
    get:
      tags: [Plugins]
      operationId: getPluginState
      responses:
        '200':
          description: Plugin data of this installation
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginState'}
        default: *error
    put:
      tags: [Plugins]
      operationId: putPluginState
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, data]
              properties:
                expected_version: {type: integer, minimum: 0}
                data: {type: object}
      responses:
        '200':
          description: Saved; 409 version_conflict when expected_version is stale
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginState'}
        default: *error
  /v1/installations/{installation_id}/update:
    parameters: [{$ref: '#/components/parameters/InstallationId'}]
    get:
      tags: [Plugins]
      operationId: getInstallationUpdate
      summary: Is a newer release published, and which permissions would it add
      responses:
        '200':
          description: Update information with the consent screen of the latest version
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UpdateInfo'}
        default: *error
  /v1/installations/{installation_id}/upgrade:
    parameters: [{$ref: '#/components/parameters/InstallationId'}]
    post:
      tags: [Plugins]
      operationId: upgradeInstallation
      summary: Move to a newer release; expanded permissions need consent
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpgradeRequest'}
      responses:
        '200':
          description: >-
            Updated. 409 consent_required (details.added_grants) while the release needs
            grants that were not sent; 409 tools_digest_mismatch; 409 version_conflict.
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Installation'}
        default: *error
  /v1/installations/{installation_id}/discovery:
    parameters: [{$ref: '#/components/parameters/InstallationId'}]
    get:
      tags: [Plugins]
      operationId: discoverCustomInstallation
      summary: Probe an MCP server added by URL (the server is contacted through the SSRF guard)
      responses:
        '200':
          description: needs_connection when the server wants OAuth, otherwise its tools and the grants to consent to
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiscoverResult'}
        default: *error
  /v1/installations/{installation_id}/health:
    parameters: [{$ref: '#/components/parameters/InstallationId'}]
    get:
      tags: [Plugins]
      operationId: getInstallationHealth
      summary: Whether the installation's tools reach the model now, and why not (M15-R1)
      description: >-
        Resolves the manifest the way the tool router does and, for an active installation,
        lists the server's tools (through the SSRF guard) and compares their digest with the
        consented one. An installation that cannot be offered is reported here instead of
        disappearing from the model's tools.
      responses:
        '200':
          description: Health of the installation
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstallationHealth'}
        default: *error
  /v1/installations/{installation_id}/consent:
    parameters: [{$ref: '#/components/parameters/InstallationId'}]
    post:
      tags: [Plugins]
      operationId: consentCustomInstallation
      summary: 'Consent to the probed tools of a custom MCP server (risk per tool: annotations, editable)'
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, tools_digest, grants]
              properties:
                expected_version: {type: integer, minimum: 0}
                tools_digest: {type: string}
                grants: {type: array, maxItems: 128, items: {type: string}}
                tools:
                  type: array
                  maxItems: 1024
                  items: {type: string}
                  description: >-
                    Tools to enable (M15-R1); omitted means every usable tool. 422 validation_error
                    when a name is not served, none is chosen, or more than DiscoverResult.tool_limit.
                risks:
                  type: object
                  maxProperties: 1024
                  additionalProperties: {type: string, enum: [read, write_reversible, write_external]}
                  description: >-
                    Risk per chosen tool the user changed (M72); other tools get the proposed risk of
                    DiscoverResult.tools[].risk. 422 for a tool that is not chosen. Echo in grants
                    the tools.<risk> grant of every resulting risk (DiscoverResult.risk_grants).
      responses:
        '200':
          description: Installation is active
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Installation'}
        default: *error
  /v1/connections:
    get:
      tags: [Plugins]
      operationId: listConnections
      responses:
        '200':
          description: Integration accounts (tokens are never returned)
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Connection'}}
        default: *error
    post:
      tags: [Plugins]
      operationId: startConnection
      summary: >-
        Start the OAuth flow (PKCE S256, resource indicator) of an installation. A browser (cookie) start also sets
        the Lax cookie mia_oauth_binding (path /v1/connections/callback) that the callback must present (OI-M15-003, M30)
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [installation_id]
              properties:
                installation_id: {type: string, format: uuid}
                return_to:
                  type: string
                  maxLength: 300
                  pattern: '^/(?!/)'
                  description: Path on this origin to send the browser to after consent, with ?connection=ok|error
      responses:
        '200':
          description: >-
            server.auth mia_token (M51-R1): no browser step. The user has signed in to the plugin's app with Mia (active
            grant of manifest server.clientId with openid), so the installation is active and Mia mints a 5-minute
            token per call. Without that grant: 409 connection_sign_in_required (details.client_id)
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [connection_id, status]
                properties:
                  connection_id: {type: string, format: uuid}
                  status: {type: string, enum: [connected]}
        '201':
          description: OAuth flow started; open authorization_url
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [connection_id, authorization_url]
                properties:
                  connection_id: {type: string, format: uuid}
                  authorization_url: {type: string, format: uri}
        default: *error
  /v1/connections/callback:
    get:
      tags: [Plugins]
      operationId: connectionOAuthCallback
      summary: Redirect target of the provider's consent; the single-use state is the credential
      security: []
      parameters:
        - {name: state, in: query, required: false, schema: {type: string, maxLength: 256}}
        - {name: code, in: query, required: false, schema: {type: string, maxLength: 2048}}
        - {name: error, in: query, required: false, schema: {type: string, maxLength: 128}}
      responses:
        '200':
          description: Connected (HTML page when no return_to was given)
          headers: *rid
          content:
            text/html:
              schema: {type: string}
        '303':
          description: Redirect to return_to with ?connection=ok or ?connection=error&code=...
          headers: *rid
        '400':
          description: Unknown, expired or used state, or the provider refused
          headers: *rid
          content:
            text/html:
              schema: {type: string}
  /v1/connections/client-metadata.json:
    get:
      tags: [Plugins]
      operationId: getConnectionClientMetadata
      summary: Client ID Metadata Document that identifies Mia to authorization servers
      security: []
      responses:
        '200':
          description: OAuth client metadata
          headers: *rid
          content:
            application/json:
              schema: {type: object}
  /v1/connections/{connection_id}:
    parameters: [{$ref: '#/components/parameters/ConnectionId'}]
    delete:
      tags: [Plugins]
      operationId: deleteConnection
      summary: Revoke at the provider and delete the tokens; the installation needs a connection again
      parameters: [*idem]
      responses:
        '204':
          description: Revoked and deleted
          headers: *rid
        default: *error
  /v1/dashboard:
    get:
      tags: [Plugins]
      operationId: getDashboard
      responses:
        '200':
          description: Tile layout (WidgetInstance list)
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dashboard'}
        default: *error
    put:
      tags: [Plugins]
      operationId: putDashboard
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Dashboard'}
      responses:
        '200':
          description: Saved; 409 version_conflict (details.current_version) when expected_version is stale
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dashboard'}
        default: *error
  /v1/dashboard/tiles/{tile_id}:
    parameters:
      - {name: tile_id, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      tags: [Plugins]
      operationId: patchDashboardTile
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, settings]
              properties:
                expected_version: {type: integer, minimum: 0}
                settings: {type: object}
      responses:
        '200':
          description: Tile settings saved; 409 version_conflict when expected_version is stale
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DashboardTile'}
        default: *error
  /v1/installations/{installation_id}/tiles/{tile_id}:
    parameters:
      - {$ref: '#/components/parameters/InstallationId'}
      - {name: tile_id, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9-]{0,47}$'}}
    get:
      tags: [Plugins]
      operationId: getTileDocument
      summary: The ui:// document of a dashboard tile for the MCP Apps host (M31), CSP and bridge included
      responses:
        '200':
          description: Tile document and what the host may offer it
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TileDocument'}
        default: *error
  /v1/installations/{installation_id}/tiles/{tile_id}/tool-calls:
    parameters:
      - {$ref: '#/components/parameters/InstallationId'}
      - {name: tile_id, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9-]{0,47}$'}}
    post:
      tags: [Plugins]
      operationId: callTileTool
      summary: A tool call made by a tile through the host (JSON-RPC tools/call); never write_external
      description: >-
        The tile reaches only the tools of its own installation. A `write_external` tool is refused with
        403 tool_permission_denied and nothing is executed; other failures are a 200 with
        `status` and `error_code` of the router (M13).
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 128, description: Local tool name or plugin_id.name}
                arguments: {type: object}
      responses:
        '200':
          description: Outcome of the call
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TileToolResult'}
        default: *error
  /v1/model-connections:
    get:
      security:
        - bearerAuth: []
        - cookieAuth: []
      tags: [Plugins]
      operationId: listModelConnections
      summary: The user's model connections (M11); keys are never returned
      responses:
        '200':
          description: Connections
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ModelConnection'}}
        default: *error
    post:
      security:
        - bearerAuth: []
        - cookieAuth: []
      tags: [Plugins]
      operationId: createModelConnection
      parameters: [*idem]
      description: >-
        Idempotency-Key is accepted for uniformity with the other mutations; M11 does not use it
        yet, a duplicate answers 409 connection_conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, label, model]
              properties:
                provider: {type: string, enum: [openai, deepinfra, groq, mistral, local, anthropic, gemini, ollama]}
                label: {type: string, minLength: 1, maxLength: 80}
                model: {type: string, minLength: 1, maxLength: 160}
                api_key: {type: string, maxLength: 512, writeOnly: true}
                base_url: {type: string, maxLength: 512}
                capability: {type: string, enum: [tools, chat_only]}
                make_primary: {type: boolean}
      responses:
        '201':
          description: Connection created
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelConnection'}
        default: *error
  /v1/model-connections/chatgpt-plan/sign-in:
    post:
      security:
        - bearerAuth: []
        - cookieAuth: []
      tags: [Plugins]
      operationId: startChatgptPlanSignIn
      summary: Start Sign in with ChatGPT (browser on the backend host, OI-M11-002)
      parameters: [*idem]
      responses:
        '201':
          description: Sign-in attempt
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [attempt_id, authorize_url, expires_at]
                properties:
                  attempt_id: {type: string}
                  authorize_url: {type: string}
                  expires_at: {type: string, format: date-time}
                  listening:
                    type: boolean
                    description: >-
                      M62-T1: a loopback listener on the backend waits for the redirect. When
                      false (hosted backend) the client asks the user to paste the address the
                      browser landed on (POST .../callback).
        default: *error
  /v1/model-connections/chatgpt-plan/sign-in/{attempt_id}:
    parameters:
      - {name: attempt_id, in: path, required: true, schema: {type: string}}
    get:
      security:
        - bearerAuth: []
        - cookieAuth: []
      tags: [Plugins]
      operationId: getChatgptPlanSignIn
      responses:
        '200':
          description: Attempt status
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [attempt_id, status, error_code, connection_id]
                properties:
                  attempt_id: {type: string}
                  status: {type: string, enum: [pending, completed, failed]}
                  error_code: {type: [string, 'null']}
                  connection_id: {type: [string, 'null'], format: uuid}
        default: *error
  /v1/model-connections/chatgpt-plan/sign-in/{attempt_id}/callback:
    parameters:
      - {name: attempt_id, in: path, required: true, schema: {type: string}}
    post:
      security:
        - bearerAuth: []
        - cookieAuth: []
      tags: [Plugins]
      operationId: completeChatgptPlanSignIn
      summary: >-
        Complete Sign in with ChatGPT with the pasted loopback redirect address (M62-T1, hosted
        backend). Errors sign_in_callback_invalid (422, attempt stays pending), sign_in_not_pending (409).
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [callback_url]
              properties:
                callback_url: {type: string, minLength: 1, maxLength: 4096}
      responses:
        '200':
          description: Attempt status after the code exchange
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [attempt_id, status, error_code, connection_id]
                properties:
                  attempt_id: {type: string}
                  status: {type: string, enum: [pending, completed, failed]}
                  error_code: {type: [string, 'null']}
                  connection_id: {type: [string, 'null'], format: uuid}
        default: *error
  /v1/model-connections/{connection_id}:
    parameters: [{$ref: '#/components/parameters/ConnectionId'}]
    get:
      security:
        - bearerAuth: []
        - cookieAuth: []
      tags: [Plugins]
      operationId: getModelConnection
      responses:
        '200':
          description: Connection
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelConnection'}
        default: *error
    patch:
      security:
        - bearerAuth: []
        - cookieAuth: []
      tags: [Plugins]
      operationId: updateModelConnection
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                label: {type: string, minLength: 1, maxLength: 80}
                model: {type: string, minLength: 1, maxLength: 160}
                api_key: {type: string, maxLength: 512, writeOnly: true}
                base_url: {type: string, maxLength: 512}
                capability: {type: string, enum: [tools, chat_only]}
                make_primary: {type: boolean}
      responses:
        '200':
          description: Updated connection
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelConnection'}
