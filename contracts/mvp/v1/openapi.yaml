            application/json:
              schema: {$ref: '#/components/schemas/DeviceToolCallList'}
        default: *error
  /v1/devices/{device_id}/grants:
    parameters:
      - {name: device_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Devices]
      operationId: listDeviceGrants
      summary: Persistent permissions this device gave to other clients (M70)
      responses:
        '200':
          description: Active grants, newest first
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceGrantList'}
        default: *error
  /v1/devices/{device_id}/grants/{grant_id}:
    parameters:
      - {name: device_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: grant_id, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      tags: [Devices]
      operationId: revokeDeviceGrant
