      x-mia-idempotency: exempt
      security:
        - miaOAuth: [llm.generate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, input]
              properties:
                model: {type: string, examples: ['mia:default']}
                input: {oneOf: [{type: string}, {type: array, items: {type: object}}]}
                instructions: {type: string}
                tools: {type: array, items: {type: object}}
                stream: {type: boolean}
                max_output_tokens: {type: integer, minimum: 1}
                mia: {$ref: '#/components/schemas/MiaExtensions'}
      responses:
        '200':
          description: OpenAI-compatible response object (+ mia {run_id, cost_usd}) or SSE events
          headers: *rid
          content:
            application/json:
              schema: {type: object}
            text/event-stream:
              schema: {type: string}
        default: *error
  /v1/models:
    get:
      tags: [Apps]
      operationId: listAppModels
      summary: OpenAI-compatible model list; only mia:default (M50)
      security:
        - miaOAuth: [llm.generate]
      responses:
        '200':
          description: Models
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: {type: string, enum: [list]}
                  data: {type: array, items: {type: object}}
        default: *error
  /v1/oauth/requests/{handle}:
    get:
      tags: [Apps]
      operationId: getAuthorizationRequest
      summary: Consent screen data; the first signed-in viewer owns the request (M50)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - {name: handle, in: path, required: true, schema: {type: string, minLength: 8, maxLength: 80}}
      responses:
        '200':
          description: Client, requested scopes with Russian texts, defaults for categories and limit
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthorizationRequestView'}
        default: *error
  /v1/oauth/requests/{handle}/decision:
    post:
      tags: [Apps]
      operationId: decideAuthorizationRequest
      summary: Approve or deny; returns where the browser goes next (code or error redirect)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - {name: handle, in: path, required: true, schema: {type: string, minLength: 8, maxLength: 80}}
        - *idem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              additionalProperties: false
              properties:
                decision: {type: string, enum: [approve, deny]}
                scopes: {type: array, items: {type: string}, maxItems: 32, description: Subset of the requested scopes}
                memory_categories:
                  type: array
                  items: {type: string, enum: [profile, work, home, interests, other]}
                monthly_limit_usd: {type: number, minimum: 0}
      responses:
        '200':
          description: Same Idempotency-Key replays the first answer
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [redirect_to]
                properties:
                  redirect_to: {type: string, format: uri}
        default: *error
  /v1/apps:
    get:
      tags: [Apps]
      operationId: listConnectedApps
      summary: «Подключённые приложения» with this month's spend (M50)
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Active grants
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ConnectedApp'}}
        default: *error
  /v1/apps/{grant_id}:
    get:
      tags: [Apps]
      operationId: getConnectedApp
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - {name: grant_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: One grant
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectedApp'}
        default: *error
    patch:
      tags: [Apps]
      operationId: updateConnectedApp
      summary: Change the monthly limit or memory categories, or drop scopes
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - {name: grant_id, in: path, required: true, schema: {type: string, format: uuid}}
        - *idem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                monthly_limit_usd: {type: number, minimum: 0}
                memory_categories: {type: array, items: {type: string}}
                remove_scopes: {type: array, items: {type: string}, maxItems: 32}
      responses:
        '200':
          description: Updated grant
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectedApp'}
        default: *error
    delete:
      tags: [Apps]
      operationId: revokeConnectedApp
      summary: Disconnect the app; every token of the grant stops working at once
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - {name: grant_id, in: path, required: true, schema: {type: string, format: uuid}}
        - *idem
      responses:
        '204':
          description: Revoked (repeating is a no-op)
          headers: *rid
        default: *error
  /v1/apps/{grant_id}/usage:
    get:
      tags: [Apps]
      operationId: getConnectedAppUsage
      summary: Spend journal (provider cost or a token-based estimate)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - {name: grant_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Newest first
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [month_start, month_spend_usd, monthly_limit_usd, items]
                properties:
                  month_start: {type: string, format: date-time}
                  month_spend_usd: {type: string}
                  monthly_limit_usd: {type: string}
                  items:
                    type: array
                    items:
                      type: object
                      required: [at, surface, input_tokens, output_tokens, cost_usd, estimated]
                      properties:
                        at: {type: string, format: date-time}
                        surface: {type: string, enum: [chat_completions, responses, mcp]}
                        run_id: {type: [string, 'null'], format: uuid}
                        input_tokens: {type: integer}
                        output_tokens: {type: integer}
                        cost_usd: {type: string}
                        estimated: {type: boolean}
        default: *error
  /v1/apps/{grant_id}/access-log:
    get:
      tags: [Apps]
      operationId: getConnectedAppAccessLog
      summary: Memory access log entries of this app (actor app)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - {name: grant_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Newest first; same item shape as /v1/memory/access-log
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {type: object}}
        default: *error
  /oauth/userinfo:
    get:
      tags: [Apps]
      operationId: oauthUserinfo
      summary: >-
        OIDC userinfo; sub is pairwise per client host. Also the way a resource server (plugin MCP server) checks a
        Mia token: it accepts tokens bound to any resource Mia issued them for and reports that resource as aud
      security:
        - miaOAuth: [openid]
      responses:
        '200':
          description: >-
            sub (+ name, picture, locale, zoneinfo with profile; email with email); azp = client_id the token was
            issued to; aud = RFC 8707 resource the token is bound to (absent for tokens without a resource). A
            resource server must require aud == its own URL (M51-R1)
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [sub, azp]
                properties:
                  sub: {type: string}
                  azp: {type: string}
                  aud: {type: string}
        default: *error
  /oauth/jwks.json:
    get:
      tags: [Apps]
      operationId: oauthJwks
      summary: Public ES256 key of ID tokens
      security: []
      responses:
        '200':
          description: JWK Set
          headers: *rid
          content:
            application/json:
              schema: {type: object}
  /.well-known/openid-configuration:
    get:
      tags: [Apps]
      operationId: getOpenIdConfiguration
      summary: Same document as /.well-known/oauth-authorization-server
      security: []
      responses:
        '200':
          description: OIDC discovery metadata
          headers: *rid
          content:
            application/json:
              schema: {type: object}
  /.well-known/oauth-protected-resource:
    get:
      tags: [Apps]
      operationId: getApiResourceMetadata
      summary: RFC 9728 metadata of the API resource
      security: []
      responses:
        '200':
          description: resource = issuer
          headers: *rid
          content:
            application/json:
              schema: {type: object}
  /.well-known/oauth-protected-resource/mcp:
    get:
      tags: [Apps]
      operationId: getMcpResourceMetadata
      summary: RFC 9728 metadata of /mcp (named in the 401 WWW-Authenticate challenge)
      security: []
      responses:
        '200':
          description: resource = <issuer>/mcp
          headers: *rid
          content:
            application/json:
              schema: {type: object}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: mia_session
      description: >-
        Web session (HttpOnly, SameSite=Strict), an alternative to bearerAuth for the first-party
        web client. Mutations must be same-origin; otherwise 403 permission_denied.
    miaOAuth:
      type: oauth2
      description: «Войти через Mia» (ADR-0013). Public clients use PKCE; clients are identified by CIMD URLs.
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          refreshUrl: /oauth/token
          scopes:
            openid: Sign-in identity
            profile: Name
            email: Email
            llm.generate: Requests to the user's active model within an app budget
            memory.context: Core injects relevant memory into the app's model requests
            memory.suggest: Suggest facts (land as suggested)
            memory.read:profile: Read raw profile facts (logged)
            memory.read:work: Read raw work facts (logged)
            memory.read:home: Read raw home facts (logged)
            memory.read:health: Read raw health facts (logged)
            memory.read:finance: Read raw finance facts (logged)
            memory.read:interests: Read raw interests facts (logged)
            memory.read:other: Read raw other facts and people names (logged)
            tools.use: Use installed plugins; narrowed as tools.use:<plugin_id>
            jobs: Create background jobs
            notify: Notify the user
            mia.install: Register the app as a Mia plugin (MCP server)
  headers:
    RequestId:
      description: Opaque correlation identifier
      schema: {type: string, minLength: 1, maxLength: 128}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique per user, endpoint and canonical mutation request
      schema: {type: string, minLength: 16, maxLength: 128}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string, minLength: 1, maxLength: 512}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    RunId:
      name: run_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PluginId:
      name: plugin_id
      in: path
      required: true
      schema: {type: string}
    InstallationId:
      name: installation_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ConnectionId:
      name: connection_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RecordId:
      name: fact_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PersonId:
      name: person_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    JobId:
      name: job_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ScheduleId:
      name: schedule_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Error:
      description: Stable public error envelope
      headers: *rid
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    MiaExtensions:
      type: object
      description: Mia extensions of the OpenAI-compatible endpoints (extra_body={"mia":{...}}), M50
      additionalProperties: false
      properties:
        context: {type: boolean, default: true, description: Inject memory when the token has memory.context}
        tools:
          type: array
          items: {type: string}
          description: Plugin ids (or "*") Mia may use for this request; needs tools.use[:<plugin_id>]
        budget:
          type: object
          additionalProperties: false
          properties:
            max_usd: {type: number, exclusiveMinimum: 0}
    AuthorizationRequestView:
      type: object
      required: [client, scopes, memory_categories, monthly_limit_usd, max_monthly_limit_usd, existing_grant, expires_at]
      properties:
        client:
          type: object
          required: [client_id, name, redirect_host]
          properties:
            client_id: {type: string, format: uri}
            name: {type: string}
            client_uri: {type: [string, 'null']}
            logo_uri: {type: [string, 'null']}
            redirect_host: {type: string}
        scopes:
          type: array
          items:
            type: object
            required: [scope, title, description, sensitive, available]
            properties:
              scope: {type: string}
              title: {type: string}
              description: {type: string}
              sensitive: {type: boolean}
              available: {type: boolean, description: false while no app-facing endpoint exists (jobs, notify, mia.install)}
        memory_categories: {type: array, items: {type: string}}
        monthly_limit_usd: {type: string}
        max_monthly_limit_usd: {type: string}
        existing_grant: {type: boolean}
        expires_at: {type: string, format: date-time}
    ConnectedApp:
      type: object
      required: [id, client_id, client_name, scopes, memory_categories, monthly_limit_usd, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        client_id: {type: string, format: uri}
        client_name: {type: string}
        client_uri: {type: [string, 'null']}
        logo_uri: {type: [string, 'null']}
        scopes: {type: array, items: {type: string}}
        memory_categories: {type: array, items: {type: string}}
        monthly_limit_usd: {type: string}
        month_spend_usd: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id, retryable]
          properties:
            code: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
            message: {type: string, minLength: 1, maxLength: 500}
            request_id: {type: string, minLength: 1, maxLength: 128}
            retryable: {type: boolean}
            details: {type: object}
    CreateRunRequest:
      type: object
      additionalProperties: false
      required: [profile, input]
      properties:
        profile: {type: string, enum: [voice, chat]}
        input:
          type: object
          additionalProperties: false
          required: [text]
          properties:
            text: {type: string, minLength: 1, maxLength: 16000}
        conversation_id:
          type: string
          format: uuid
          description: >-
            Chat to write to (Chat.id), for voice too (M74, ADR-0017); omitted = the default
            (most recently active) chat. A foreign or missing chat is conversation_not_found.
        device_id: {type: string, format: uuid}
        incognito: {type: boolean, default: false}
    Run:
      type: object
      required: [id, profile, status, created_at, events_url]
      properties:
        id: {type: string, format: uuid}
        profile: {type: string, enum: [voice, chat, job, app]}
        status:
          type: string
          enum: [running, waiting_approval, cancel_requested, completed, failed, cancelled]
        created_at: {type: string, format: date-time}
        events_url: {type: string}
        response: {$ref: '#/components/schemas/AssistantResponse'}
        model: {type: string, description: Resolved model reference (M12)}
        conversation_id: {type: string, format: uuid, description: Feed the run writes to; absent for incognito}
        steps: {type: integer, minimum: 0}
        tool_calls: {type: integer, minimum: 0}
        error: {$ref: 'common.schema.json#/$defs/publicError'}
        cancel_reason: {type: string, enum: [user, client_disconnected, budget_exceeded, superseded]}
        finished_at: {type: string, format: date-time}
    FeedItem:
      type: object
      required: [id, role, source, text, display, run_id, created_at]
      properties:
        id: {type: string, format: uuid}
        role: {type: string, enum: [user, assistant]}
        source:
          type: string
          enum: [run_voice, run_chat, run_job, run_app, android_text, android_voice]
          description: >-
            Where the message came from; run_* messages carry run_id. A job result card (M74)
            is run_job with card set and run_id null
        text: {type: string, description: Message text (user input, or the answer's markdown/speech)}
        display:
          type: [object, 'null']
          description: >-
            The answer's display exactly as in AssistantResponse.display
            (assistant-response.schema.json); null for user messages and plain answers
        run_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        actions:
          type: array
          maxItems: 4
          items: {$ref: '#/components/schemas/ScreenAction'}
          description: >-
            Screen-only actions of the answer's tool calls (M41-R1), e.g. the one-time Telegram
            bot link; absent when there are none. After expires_at the action has no url and
            expired=true. Never part of the model's history.
        card:
          $ref: '#/components/schemas/FeedCard'
        steps:
          type: array
          minItems: 1
          maxItems: 32
          items: {$ref: '#/components/schemas/FeedStep'}
          description: >-
            Tool steps of an assistant answer in call order (M74-R1), with their approvals, read
            from the run's tool.call.* events and the approvals; a job result card has the steps
            of the job's run. Absent when the answer called no tool. Lets a client show steps,
            failure reasons and decided approvals after a reload or on another device.
    FeedStep:
      type: object
      additionalProperties: false
      required: [tool_call_id, tool, status]
      description: >-
        One tool call of an answer (M74-R1). arguments and error_detail are exactly those of
        tool.call.started / tool.call.completed (already redacted, M73). A call that never
        completed in a finished answer is uncertain.
      properties:
        tool_call_id: {type: string, minLength: 1, maxLength: 128}
        tool: {type: string, minLength: 1, maxLength: 200}
        plugin_id: {type: string, maxLength: 128}
        risk: {type: string, enum: [read, write_reversible, write_external]}
        executor: {type: string, enum: [server, device]}
        status: {type: string, enum: [running, succeeded, failed, denied, expired, uncertain, cancelled]}
        arguments: {type: object, description: Redacted arguments as in tool.call.started}
        error_code: {type: string, maxLength: 64, description: error.code of tool.call.completed (not succeeded)}
        error_detail: {type: string, minLength: 1, maxLength: 300, description: Why it failed, as in tool.call.completed}
        approval: {$ref: '#/components/schemas/FeedStepApproval'}
    FeedStepApproval:
      type: object
      additionalProperties: false
      required: [id, status, summary]
      description: >-
        The approval this call asked for. channel and device_id say where it was decided
        (android with device_id = on the phone; web; voice_trusted).
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [pending, approved, denied, expired, cancelled]}
        summary: {type: string, minLength: 1, maxLength: 500}
        decided_at: {type: string, format: date-time}
        channel: {type: string, enum: [web, android, voice_trusted]}
        device_id: {type: string, format: uuid}
    ScreenAction:
      type: object
      additionalProperties: false
      required: [kind, label]
      description: >-
        Same shape as common.schema.json#/$defs/screenAction (M41-R1): a button for the user,
        never model content. url is absent only when expired is true.
      properties:
        kind: {type: string, enum: [open_url]}
        url:
          type: string
          maxLength: 2048
          pattern: '^(https://[^\s@/?#]+([/?#][^\s]*)?|tg://[^\s]+)$'
        label: {type: string, minLength: 1, maxLength: 40}
        expires_at: {type: string, format: date-time}
        expired: {type: boolean, const: true}
    FeedPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/FeedItem'}}
        next_cursor: {type: [string, 'null'], description: Pass as before; null when there is nothing older}
        conversation_id:
          type: [string, 'null']
          format: uuid
          description: >-
            The chat of this page (M74) - the requested one, or the default chat; null when the
            user has no chat yet
    FeedCard:
      type: object
      additionalProperties: false
      required: [type, job_id, status, title]
      description: >-
        A result card posted into the source chat when a background job started there
        finishes (M74, ADR-0017 §4); the same result is also an inbox item. text/display of the
        FeedItem carry the result; the card names the job.
      properties:
        type: {type: string, enum: [job_result]}
        job_id: {type: string, format: uuid}
        status: {type: string, enum: [succeeded, failed]}
        title: {type: string, maxLength: 200}
        inbox_item_id:
          type: string
          format: uuid
          description: >-
            The inbox item with the same result (M74-R1): open it with GET /v1/inbox/{item_id}
            (full text in InboxItem.text). Absent on cards posted before M74-R1
    Chat:
      type: object
      additionalProperties: false
      required: [id, kind, title, title_source, pinned, pinned_at, created_at, last_message_at, last_assistant_at, preview, preview_role]
      description: >-
        One chat (ADR-0017). kind telegram is the dialog with the Mia bot (one per user; /new in
        Telegram keeps it as a plain chat). title_source auto = provisional from the first message,
        model = chosen by the model, user = renamed by the user; title is null only for a new chat
        without messages.
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [chat, telegram]}
        title: {type: [string, 'null'], maxLength: 80}
        title_source: {type: [string, 'null'], enum: [auto, model, user, null]}
        pinned: {type: boolean}
        pinned_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        last_message_at: {type: [string, 'null'], format: date-time}
        last_assistant_at: {type: [string, 'null'], format: date-time, description: Last answer; drives «Продолжить прошлый»}
        preview: {type: [string, 'null'], maxLength: 120, description: The last message, clipped}
        preview_role: {type: [string, 'null'], enum: [user, assistant, null]}
    ChatPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Chat'}}
        next_cursor: {type: [string, 'null']}
    CreateChatRequest:
      type: object
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1, maxLength: 80}
    UpdateChatRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: {type: [string, 'null'], minLength: 1, maxLength: 80, description: null returns to the automatic title}
        pinned: {type: boolean}
    ChatContinue:
      type: object
      additionalProperties: false
      required: [chat, within_seconds]
      properties:
        chat:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/Chat'}
        within_seconds: {type: integer}
    ChatSettings:
      type: object
      additionalProperties: false
      required: [retention_days, choices]
      properties:
        retention_days:
          type: [integer, 'null']
          enum: [30, 60, 180, null]
          description: Days of inactivity before an unpinned chat is deleted; null = never
        choices:
          type: array
          items: {type: [integer, 'null']}
    UpdateChatSettingsRequest:
      type: object
      additionalProperties: false
      required: [retention_days]
      properties:
        retention_days: {type: [integer, 'null'], enum: [30, 60, 180, null]}
    NowItem:
      type: object
      additionalProperties: false
      required: [kind, id, label, state, deadline_at, remaining_ms, duration_ms, started_at, plugin_id, installation_id, job_id, run_id, conversation_id, cancel]
      description: >-
        One active thing. Timer/alarm/focus: id is the plugin item id, deadline_at/remaining_ms
        count down (remaining_ms is frozen and deadline_at null while paused). Job: id = job_id,
        conversation_id = the chat it was started from (null for schedules, apps and the API).
      properties:
        kind: {type: string, enum: [timer, alarm, focus, job]}
        id: {type: string, minLength: 1}
        label: {type: [string, 'null'], maxLength: 120}
        state: {type: string, enum: [running, scheduled, paused, queued, waiting_approval]}
        deadline_at: {type: [string, 'null'], format: date-time}
        remaining_ms: {type: [integer, 'null'], minimum: 0}
        duration_ms: {type: [integer, 'null']}
        started_at: {type: [string, 'null'], format: date-time, description: Item created / job created or started}
        plugin_id: {type: [string, 'null']}
        installation_id: {type: [string, 'null'], format: uuid}
        job_id: {type: [string, 'null'], format: uuid}
        run_id: {type: [string, 'null'], format: uuid}
        conversation_id: {type: [string, 'null'], format: uuid}
        cancel:
          description: >-
            tile_tool - POST /v1/installations/{installation_id}/tiles/{tile_id}/tool-calls with
            {name, arguments}; job - POST /v1/jobs/{job_id}/cancel
          oneOf:
            - type: object
              additionalProperties: false
              required: [type, installation_id, tile_id, name, arguments]
              properties:
                type: {const: tile_tool}
                installation_id: {type: string, format: uuid}
                tile_id: {type: string}
                name: {type: string}
                arguments: {type: object}
            - type: object
              additionalProperties: false
              required: [type, job_id]
              properties:
                type: {const: job}
                job_id: {type: string, format: uuid}
    NowPage:
      type: object
      additionalProperties: false
      required: [server_time, items]
      properties:
        server_time: {type: string, format: date-time}
        items: {type: array, items: {$ref: '#/components/schemas/NowItem'}}
    CatalogEntry:
      type: object
      required: [plugin_id, version, manifest]
      properties:
        plugin_id: {type: string}
        version: {type: string}
        manifest: {$ref: '#/components/schemas/PluginManifest'}
        name: {type: string}
        description: {type: string}
        category: {type: string, enum: [work, productivity, communication, knowledge, home, utilities, fun]}
        author: {type: [string, 'null']}
        kind: {type: string, enum: [builtin, remote, declarative]}
        tagline: {type: [string, 'null'], description: Showcase line (store_meta; not part of mia.json)}
        color: {type: [string, 'null']}
        art: {type: [string, 'null']}
        featured: {type: boolean}
        rating:
          type: object
          required: [average, count]
          properties:
            average: {type: [number, 'null']}
            count: {type: integer, minimum: 0}
        installs: {type: integer, minimum: 0}
        icon_url: {type: [string, 'null']}
        screenshots: {type: array, items: {type: string}}
        published_at: {type: string, format: date-time}
    CatalogEntryDetail:
      allOf:
        - {$ref: '#/components/schemas/CatalogEntry'}
        - type: object
          required: [versions, consent]
          properties:
            versions: {type: array, items: {type: string}, description: 'Published versions, newest first'}
            consent: {$ref: '#/components/schemas/Consent'}
    Consent:
      type: object
      required: [plugin_id, version, tools_digest, tools, grants, network, public_web, llm, memory, notify, schedules, device_tools, requires_connection]
      properties:
        plugin_id: {type: string}
        version: {type: string}
        tools_digest: {type: string, description: Echo it in the install request}
        tools:
          type: array
          items:
            type: object
            required: [name, description, risk, voice]
            properties:
              name: {type: string}
              description: {type: string}
              risk: {type: string, enum: [read, write_reversible, write_external]}
              voice: {type: boolean}
        grants:
          type: array
          description: >-
            Grant vocabulary (OI-M13-002): tools.read | tools.write_reversible | tools.write_external |
            network:<host> | network.public_web | llm.generate | memory.context | memory.suggest |
            memory.read:<scope> | notify | schedules. Echo every id in the install request.
          items:
            type: object
            required: [id, text]
            properties:
              id: {type: string}
              text: {type: string}
        network: {type: array, items: {type: string}}
        public_web: {type: boolean}
        llm:
          type: object
          required: [via_host, monthly_budget_usd]
          properties:
            via_host: {type: boolean}
            monthly_budget_usd: {type: [number, 'null']}
        memory: {type: array, items: {type: string}}
        notify: {type: boolean}
        schedules: {type: boolean}
        device_tools: {type: array, items: {type: string}}
        requires_connection: {type: boolean}
        stores_state: {type: boolean}
        where_it_runs:
          type: object
          description: M72, the store's «Где работает» block (manifest whereItRuns; derived from server.kind when absent)
          required: [cloud, device, runs_on]
          properties:
            cloud: {type: string, description: What runs in the Mia cloud}
            device: {type: [string, 'null'], description: What may run on the phone, only on request and with consent (ADR-0016)}
            runs_on: {type: string, enum: [cloud, cloud_and_device]}
        device_capabilities:
          type: array
          description: M72, manifest requires.deviceCapabilities; listed on the consent screen
          items:
            type: object
            required: [capability, kind, label, description, optional, model_sees]
            properties:
              capability: {type: string, description: 'contacts.read | alarm.clock | apps.open | telegram.draft | <device tool>'}
              kind: {type: string, enum: [read, action, external]}
              label: {type: string}
              description: {type: string}
              optional: {type: boolean, description: The plugin works in the cloud without it}
              model_sees: {type: string}
    InstallRequest:
      type: object
      additionalProperties: false
      required: [version, tools_digest, grants]
      properties:
        version: {type: string}
        tools_digest: {type: string}
        grants: {type: array, maxItems: 128, items: {type: string}}
    UpgradeRequest:
      type: object
      additionalProperties: false
      required: [expected_version, version, tools_digest, grants]
      properties:
        expected_version: {type: integer, minimum: 0, description: state_version of the installation}
        version: {type: string}
        tools_digest: {type: string}
        grants: {type: array, maxItems: 128, items: {type: string}}
    UpdateInfo:
      type: object
      required: [installation_id, plugin_id, installed_version, latest_version, update_available, added_grants, removed_grants, digest_changed, consent]
      properties:
        installation_id: {type: string, format: uuid}
        plugin_id: {type: string}
        installed_version: {type: string}
        latest_version: {type: string}
        update_available: {type: boolean}
        added_grants: {type: array, items: {type: string}}
        removed_grants: {type: array, items: {type: string}}
        digest_changed: {type: boolean}
        consent:
          oneOf:
            - {$ref: '#/components/schemas/Consent'}
            - {type: 'null'}
    DiscoverResult:
      type: object
      required: [installation_id, state, tools, tools_digest, grants, host]
      properties:
        installation_id: {type: string, format: uuid}
        state: {type: string, enum: [needs_connection, ready]}
        tools:
          type: array
          items:
            type: object
            required: [name, description, risk]
            properties:
              name: {type: string}
              description: {type: string}
              risk:
                type: string
                enum: [read, write_reversible, write_external]
                description: >-
                  Proposed risk (M72, OI-LIVE-002): readOnlyHint -> read, destructiveHint false ->
                  write_reversible, otherwise write_external; what the user saved earlier wins
              risk_source: {type: string, enum: [annotation, saved, default]}
              selected: {type: boolean, description: Ticked on the consent screen by default (M15-R1)}
        tools_digest: {type: [string, 'null']}
        grants:
          type: array
          items:
            type: object
            required: [id, text]
            properties:
              id: {type: string}
              text: {type: string}
        host: {type: string}
        risk_grants:
          type: array
          description: The tools.<risk> grant of every risk a tool may be set to (M72); echo those of the chosen risks
          items:
            type: object
            required: [id, text]
            properties:
              id: {type: string}
              text: {type: string}
        skipped_tools: {type: array, items: {type: string}, description: Tool names the manifest grammar cannot hold; Mia does not offer them}
        tool_limit:
          type: integer
          minimum: 0
          maximum: 96
          description: >-
            Tools this server may enable (M15-R1): at most 96 per installation and what the user's
            other active plugins leave of the 96-tool plugin budget (one model request carries at
            most 128 tools; 32 are reserved for core and device tools).
    InstallationHealth:
      type: object
      required: [installation_id, plugin_id, state, tools, declared_tools, tool_limit]
      properties:
        installation_id: {type: string, format: uuid}
        plugin_id: {type: string}
        state:
          type: string
          enum: [ok, limited, needs_attention, needs_connection, needs_consent, disabled]
          description: limited — only `tools` of `declared_tools` fit the plugin tool budget; needs_attention — nothing is offered, see problem
        problem:
          type: [string, 'null']
          enum: [manifest_invalid, manifest_missing, manifest_mismatch, tool_budget, tools_changed, server_unavailable, null]
        reason: {type: [string, 'null'], description: Content-free detail such as too_many_tools or timeout}
        tools: {type: integer, minimum: 0, description: Tools Mia offers the model from this installation}
        declared_tools: {type: integer, minimum: 0}
        tool_limit: {type: integer, minimum: 0}
    ReviewList:
      type: object
      required: [items, rating]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, plugin_id, rating, text, author, mine, updated_at]
            properties:
              id: {type: string, format: uuid}
              plugin_id: {type: string}
              rating: {type: integer, minimum: 1, maximum: 5}
              text: {type: string}
              author: {type: string, description: First name only}
              mine: {type: boolean}
              updated_at: {type: string, format: date-time}
        rating:
          type: object
          required: [average, count]
          properties:
            average: {type: [number, 'null']}
            count: {type: integer, minimum: 0}
    Installation:
      type: object
      required: [id, plugin_id, version, status]
      properties:
        id: {type: string, format: uuid}
        plugin_id: {type: string}
        version: {type: string}
        status: {type: string, enum: [active, needs_connection, needs_consent, disabled]}
        custom_url: {type: [string, 'null'], description: Set for «добавить свой MCP по URL»}
        source: {type: string, enum: [catalog, custom, legacy_web]}
        grants: {type: array, items: {type: string}, description: Consented grants (see Consent.grants)}
        tools_digest: {type: [string, 'null']}
        state_version: {type: integer, minimum: 0, description: Send back as expected_version}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CreateInstallationRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [plugin_id, version, tools_digest]
          properties:
            plugin_id: {type: string}
            version: {type: string}
            tools_digest: {type: string, description: Digest of tool descriptions the user consented to}
        - type: object
          additionalProperties: false
          required: [custom_mcp_url]
          properties:
            custom_mcp_url: {type: string, pattern: '^https://'}
    Connection:
      type: object
      required: [id, installation_id, status]
      properties:
        id: {type: string, format: uuid}
        installation_id: {type: string, format: uuid}
        plugin_id: {type: string}
        status: {type: string, enum: [pending, connected, expired, revoked]}
        account_label: {type: [string, 'null']}
        scopes: {type: [string, 'null']}
    Workspace:
      type: object
      required: [id, name, owner_user_id, layout_version]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        owner_user_id: {type: string, format: uuid}
        layout_version: {type: integer, minimum: 0}
    PluginState:
      type: object
      required: [plugin_id, data, state_version]
      properties:
        plugin_id: {type: string}
        data: {type: object}
        state_version: {type: integer, minimum: 0}
    TilePlacement:
      type: object
      required: [size, position]
      properties:
        size: {type: string, enum: ['1x1', '2x1', '2x2', '4x2', '4x4']}
        position: {type: integer, minimum: 0}
    DashboardTile:
      type: object
      required: [id, installation_id, tile_id, size, position]
      properties:
        id: {type: string, format: uuid}
        installation_id: {type: string, format: uuid}
        tile_id: {type: string}
        size: {type: string, enum: ['1x1', '2x1', '2x2', '4x2', '4x4'], description: Desktop size}
        position: {type: integer, minimum: 0, description: Desktop position}
        mobile: {$ref: '#/components/schemas/TilePlacement'}
        settings: {type: object}
        state_version: {type: integer, minimum: 0}
    Dashboard:
      type: object
      required: [expected_version, tiles]
      properties:
        expected_version: {type: integer, minimum: 0}
        tiles:
          type: array
          items: {$ref: '#/components/schemas/DashboardTile'}
    TileDocument:
      type: object
      required: [installation_id, plugin_id, tile_id, resource_uri, html, csp, sizes, mobile, refresh, tools]
      properties:
        installation_id: {type: string, format: uuid}
        plugin_id: {type: string}
        tile_id: {type: string}
        title: {type: [string, 'null']}
        resource_uri: {type: string, pattern: '^ui://'}
        html: {type: string, description: Full document; the host puts it into a sandboxed iframe (allow-scripts only)}
        csp: {type: string, description: The Content-Security-Policy already inside html}
        sizes: {type: array, items: {type: string, enum: ['1x1', '2x1', '2x2', '4x2', '4x4']}}
        mobile: {type: string, enum: [card, tile, hidden]}
        refresh:
          oneOf:
            - {type: 'null'}
            - type: object
              required: [tool, every_seconds]
              properties:
                tool: {type: string}
                every_seconds: {type: integer, minimum: 30}
        tools: {type: array, items: {type: string}, description: Local names of the tools the tile may call (no write_external)}
    TileToolResult:
      type: object
      required: [status, is_error, content, structured_content, error_code]
      properties:
        status: {type: string, enum: [succeeded, failed, approval_required, denied, expired, uncertain, cancelled]}
        is_error: {type: boolean}
        content: {type: string}
        structured_content: {type: [object, 'null']}
        error_code: {type: [string, 'null']}
    ModelConnection:
      type: object
      required: [id, provider, label, model, capability, has_key, status, is_primary, verified]
      properties:
        id: {type: string, format: uuid}
        provider: {type: string}
        label: {type: string}
        model: {type: string}
        base_url: {type: [string, 'null']}
        capability: {type: string, enum: [tools, chat_only]}
        has_key: {type: boolean}
        key_last4: {type: [string, 'null']}
        status: {type: string, enum: [active, paused, needs_reauth]}
        paused_until: {type: [string, 'null'], format: date-time}
        is_primary: {type: boolean}
        verified: {type: boolean}
        last_tested_at: {type: [string, 'null'], format: date-time}
        last_test_ok: {type: [boolean, 'null']}
        last_test_error_code: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
    RunEvent: {$ref: 'run-events.schema.json'}
    AssistantResponse: {$ref: 'assistant-response.schema.json'}
    PluginManifest: {$ref: 'plugin-manifest.schema.json'}
    Approval: {$ref: 'approval.schema.json#/$defs/Approval'}
    ApprovalDecisionRequest: {$ref: 'approval.schema.json#/$defs/ApprovalDecisionRequest'}
    DeviceToolRegistration: {$ref: 'device-tools.schema.json#/$defs/DeviceToolRegistration'}
    DeviceToolResult: {$ref: 'device-tools.schema.json#/$defs/DeviceToolResult'}
    DeviceConsent: {$ref: 'device-access.schema.json#/$defs/DeviceConsent'}
    DeviceToolCallList: {$ref: 'device-access.schema.json#/$defs/DeviceToolCallList'}
    DeviceGrantList: {$ref: 'device-access.schema.json#/$defs/DeviceGrantList'}
    DeviceAccessLog: {$ref: 'device-access.schema.json#/$defs/DeviceAccessLog'}
    DeviceCapabilitySetting: {$ref: 'device-access.schema.json#/$defs/DeviceCapabilitySetting'}
    DeviceCapabilitySettingList: {$ref: 'device-access.schema.json#/$defs/DeviceCapabilitySettingList'}
    DeviceCapabilitySettingRequest: {$ref: 'device-access.schema.json#/$defs/DeviceCapabilitySettingRequest'}
    NotificationSettings: {$ref: 'notifications.schema.json#/$defs/NotificationSettings'}
    UpdateNotificationSettingsRequest: {$ref: 'notifications.schema.json#/$defs/UpdateNotificationSettingsRequest'}
    Fact: {$ref: 'memory.schema.json#/$defs/Fact'}
    Person: {$ref: 'memory.schema.json#/$defs/Person'}
    Preference: {$ref: 'memory.schema.json#/$defs/Preference'}
    MemorySuggestion: {$ref: 'memory.schema.json#/$defs/MemorySuggestion'}
    MemorySettings:
      type: object
      required: [autosave_categories, history_retention]
      properties:
        autosave_categories: {type: array, items: {type: string}}
        history_retention: {type: string, enum: ['30d', '1y', forever, none]}
    MemoryExport:
      type: object
      required: [format, exported_at, facts, people, preferences]
      properties:
        format: {const: mia.memory.v1}
        exported_at: {type: string, format: date-time}
        facts: {type: array, items: {$ref: '#/components/schemas/Fact'}}
        people: {type: array, items: {$ref: '#/components/schemas/Person'}}
        preferences: {type: array, items: {$ref: '#/components/schemas/Preference'}}
    Job: {$ref: 'job.schema.json#/$defs/Job'}
    CreateJobRequest: {$ref: 'job.schema.json#/$defs/CreateJobRequest'}
    Schedule: {$ref: 'job.schema.json#/$defs/Schedule'}
    CreateScheduleRequest: {$ref: 'job.schema.json#/$defs/CreateScheduleRequest'}
    InboxItem: {$ref: 'job.schema.json#/$defs/InboxItem'}
