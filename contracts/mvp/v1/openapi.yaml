openapi: 3.1.0
info:
  title: MIA MVP API
  version: 1.0.0-skeleton
  description: >-
    Path skeleton of the MVP public API (ADR-0010..0013, Review §8.2). First-party
    clients (Android, web) and third-party apps use the same API. Request and
    response bodies reference the JSON Schemas next to this file; inline shapes
    are provisional and are refined additively by the session that implements
    each resource (see contracts/mvp/v1/README.md for ownership).
servers:
  - url: https://mia.example.com
security:
  - bearerAuth: []
tags:
  - name: Runs
  - name: Approvals
  - name: Plugins
  - name: Memory
  - name: Background
  - name: Devices
  - name: Apps
x-mia-anchors:
  request-id: &rid
    X-Request-ID:
      $ref: '#/components/headers/RequestId'
  idem: &idem
    $ref: '#/components/parameters/IdempotencyKey'
  error: &error
    $ref: '#/components/responses/Error'
paths:
  /v1/runs:
    post:
      tags: [Runs]
      operationId: createRun
      summary: Start a run (voice, chat, job or app profile)
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRunRequest'}
      responses:
        '202':
          description: Run accepted; follow events_url
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        default: *error
  /v1/runs/{run_id}:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    get:
      tags: [Runs]
      operationId: getRun
      responses:
        '200':
          description: Run state
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        default: *error
  /v1/runs/{run_id}/events:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    get:
      tags: [Runs]
      operationId: streamRunEvents
      summary: Server-sent events; each SSE id is the event cursor
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - name: Last-Event-ID
          in: header
          required: false
          schema: {type: string, minLength: 1, maxLength: 512}
      responses:
        '200':
          description: SSE stream of run events (data = RunEvent JSON), ends after a terminal event
          headers: *rid
          content:
            text/event-stream:
              schema: {$ref: '#/components/schemas/RunEvent'}
        default: *error
  /v1/runs/{run_id}/cancel:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    post:
      tags: [Runs]
      operationId: cancelRun
      parameters: [*idem]
      responses:
        '202':
          description: Cancellation requested; run.cancelled follows on the stream
          headers: *rid
        default: *error
  /v1/runs/{run_id}/device-tool-results:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    post:
      tags: [Runs, Devices]
      operationId: submitDeviceToolResult
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceToolResult'}
      responses:
        '204':
          description: Result accepted
          headers: *rid
        default: *error
  /v1/approvals/{approval_id}:
    parameters: [{$ref: '#/components/parameters/ApprovalId'}]
    get:
      tags: [Approvals]
      operationId: getApproval
      responses:
        '200':
          description: Approval with exact arguments
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Approval'}
        default: *error
  /v1/approvals/{approval_id}/decision:
    parameters: [{$ref: '#/components/parameters/ApprovalId'}]
    post:
      tags: [Approvals]
      operationId: decideApproval
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApprovalDecisionRequest'}
      responses:
        '200':
          description: Decision recorded (409 approval_args_mismatch / approval_expired otherwise)
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Approval'}
        default: *error
  /v1/plugins:
    get:
      tags: [Plugins]
      operationId: listCatalog
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: category, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: Store catalog entries
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/CatalogEntry'}}
                  next_cursor: {type: [string, 'null']}
        default: *error
  /v1/plugins/{plugin_id}:
    parameters: [{$ref: '#/components/parameters/PluginId'}]
    get:
      tags: [Plugins]
      operationId: getCatalogEntry
      responses:
        '200':
          description: Catalog entry with the published manifest
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CatalogEntry'}
        default: *error
  /v1/installations:
    get:
      tags: [Plugins]
      operationId: listInstallations
      responses:
        '200':
          description: Plugins installed for the current user
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Installation'}}
        default: *error
    post:
      tags: [Plugins]
      operationId: createInstallation
      summary: Install a catalog plugin, or add a custom MCP server by URL (own account only)
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateInstallationRequest'}
      responses:
        '201':
          description: Installed; connect the account next if the server needs OAuth
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Installation'}
        default: *error
  /v1/installations/{installation_id}:
    parameters: [{$ref: '#/components/parameters/InstallationId'}]
    delete:
      tags: [Plugins]
      operationId: deleteInstallation
      parameters:
        - *idem
        - {name: delete_data, in: query, required: false, schema: {type: boolean, default: false}}
      responses:
        '204':
          description: Uninstalled; tokens revoked and tiles removed
          headers: *rid
        default: *error
  /v1/connections:
    get:
      tags: [Plugins]
      operationId: listConnections
      responses:
        '200':
          description: Integration accounts (tokens are never returned)
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Connection'}}
        default: *error
    post:
      tags: [Plugins]
      operationId: startConnection
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [installation_id]
              properties:
                installation_id: {type: string, format: uuid}
      responses:
        '201':
          description: OAuth flow started; open authorization_url
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [connection_id, authorization_url]
                properties:
                  connection_id: {type: string, format: uuid}
                  authorization_url: {type: string, format: uri}
        default: *error
  /v1/connections/{connection_id}:
    parameters: [{$ref: '#/components/parameters/ConnectionId'}]
    delete:
      tags: [Plugins]
      operationId: deleteConnection
      parameters: [*idem]
      responses:
        '204':
          description: Revoked and deleted
          headers: *rid
        default: *error
  /v1/dashboard:
    get:
      tags: [Plugins]
      operationId: getDashboard
      responses:
        '200':
          description: Tile layout (WidgetInstance list)
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dashboard'}
        default: *error
    put:
      tags: [Plugins]
      operationId: putDashboard
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Dashboard'}
      responses:
        '200':
          description: Saved; 409 conflict when expected_version is stale
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dashboard'}
        default: *error
  /v1/memory/facts:
    get:
      tags: [Memory]
      operationId: listFacts
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: status, in: query, required: false, schema: {type: string, enum: [suggested, active, rejected]}}
        - {name: category, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: Facts («Что Mia знает обо мне»)
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Fact'}}
                  next_cursor: {type: [string, 'null']}
        default: *error
    post:
      tags: [Memory]
      operationId: createFact
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemorySuggestion'}
      responses:
        '201':
          description: Fact created by the user (status active)
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Fact'}
        default: *error
  /v1/memory/facts/{fact_id}:
    parameters: [{$ref: '#/components/parameters/RecordId'}]
    patch:
      tags: [Memory]
      operationId: updateFact
      summary: Edit, confirm (status=active) or reject a suggested fact
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                text: {type: string, minLength: 1, maxLength: 2000}
                category: {type: string}
                status: {type: string, enum: [active, rejected]}
                scope: {type: string, enum: [user, automation]}
      responses:
        '200':
          description: Updated fact
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Fact'}
        default: *error
    delete:
      tags: [Memory]
      operationId: deleteFact
      parameters: [*idem]
      responses:
        '204':
          description: Hard-deleted
          headers: *rid
        default: *error
  /v1/memory/people:
    get:
      tags: [Memory]
      operationId: listPeople
      responses:
        '200':
          description: People
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Person'}}
        default: *error
    post:
      tags: [Memory]
      operationId: createPerson
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name: {type: string, minLength: 1, maxLength: 120}
                aliases: {type: array, items: {type: string}}
                relation: {type: string}
                identifiers: {type: object}
                trusted: {type: boolean}
      responses:
        '201':
          description: Person created
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Person'}
        default: *error
  /v1/memory/people/{person_id}:
    parameters: [{$ref: '#/components/parameters/PersonId'}]
    patch:
      tags: [Memory]
      operationId: updatePerson
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, minProperties: 1}
      responses:
        '200':
          description: Updated person
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Person'}
        default: *error
    delete:
      tags: [Memory]
      operationId: deletePerson
      parameters: [*idem]
      responses:
        '204':
          description: Hard-deleted
          headers: *rid
        default: *error
  /v1/memory/preferences:
    get:
      tags: [Memory]
      operationId: listPreferences
      responses:
        '200':
          description: Preferences
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Preference'}}
        default: *error
  /v1/memory/preferences/{key}:
    parameters:
      - {name: key, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9_.]{0,127}$'}}
    put:
      tags: [Memory]
      operationId: putPreference
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [value]
              properties:
                value: {type: [string, number, boolean]}
      responses:
        '200':
          description: Saved preference
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preference'}
        default: *error
  /v1/memory/context:
    get:
      tags: [Memory, Apps]
      operationId: getMemoryContext
      summary: Compact context for a query, limited by the caller's memory scopes
      parameters:
        - {name: query, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 2000}}
      responses:
        '200':
          description: Context snippet; every app read is written to the access log
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [context]
                properties:
                  context: {type: string}
        default: *error
  /v1/memory/export:
    get:
      tags: [Memory]
      operationId: exportMemory
      responses:
        '200':
          description: Archive of /memories/*.md files
          headers: *rid
          content:
            application/zip:
              schema: {type: string, contentEncoding: base64}
        default: *error
  /v1/jobs:
    get:
      tags: [Background]
      operationId: listJobs
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Jobs
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Job'}}
                  next_cursor: {type: [string, 'null']}
        default: *error
    post:
      tags: [Background, Apps]
      operationId: createJob
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateJobRequest'}
      responses:
        '202':
          description: Job queued
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        default: *error
  /v1/jobs/{job_id}:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    get:
      tags: [Background, Apps]
      operationId: getJob
      responses:
        '200':
          description: Job
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        default: *error
  /v1/jobs/{job_id}/cancel:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    post:
      tags: [Background]
      operationId: cancelJob
      parameters: [*idem]
      responses:
        '202':
          description: Cancellation requested
          headers: *rid
        default: *error
  /v1/schedules:
    get:
      tags: [Background]
      operationId: listSchedules
      responses:
        '200':
          description: Schedules
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Schedule'}}
        default: *error
    post:
      tags: [Background]
      operationId: createSchedule
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateScheduleRequest'}
      responses:
        '201':
          description: Schedule created
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schedule'}
        default: *error
  /v1/schedules/{schedule_id}:
    parameters: [{$ref: '#/components/parameters/ScheduleId'}]
    patch:
      tags: [Background]
      operationId: updateSchedule
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                status: {type: string, enum: [active, paused]}
                rule: {type: string}
                timezone: {type: string}
                goal: {type: string}
      responses:
        '200':
          description: Updated schedule
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schedule'}
        default: *error
    delete:
      tags: [Background]
      operationId: deleteSchedule
      parameters: [*idem]
      responses:
        '204':
          description: Deleted
          headers: *rid
        default: *error
  /v1/inbox:
    get:
      tags: [Background]
      operationId: listInbox
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: unread, in: query, required: false, schema: {type: boolean}}
      responses:
        '200':
          description: Assistant inbox
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/InboxItem'}}
                  next_cursor: {type: [string, 'null']}
        default: *error
  /v1/inbox/{item_id}/read:
    parameters:
      - {name: item_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Background]
      operationId: markInboxItemRead
      parameters: [*idem]
      responses:
        '204':
          description: Marked as read
          headers: *rid
        default: *error
  /v1/notify:
    post:
      tags: [Apps]
      operationId: notifyUser
      summary: Notify the user (scope notify)
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text: {type: string, minLength: 1, maxLength: 1000}
                channels: {type: array, items: {type: string, enum: [push, telegram, inbox]}}
      responses:
        '202':
          description: Queued
          headers: *rid
        default: *error
  /v1/devices/push-token:
    put:
      tags: [Devices]
      operationId: putPushToken
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device_id, provider, token]
              properties:
                device_id: {type: string, format: uuid}
                provider: {type: string, enum: [fcm]}
                token: {type: string, minLength: 1, maxLength: 4096}
      responses:
        '204':
          description: Stored
          headers: *rid
        default: *error
  /v1/devices/{device_id}/tools:
    parameters:
      - {name: device_id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      tags: [Devices]
      operationId: putDeviceTools
      parameters: [*idem]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceToolRegistration'}
      responses:
        '204':
          description: Declarations replaced
          headers: *rid
        default: *error
  /v1/chat/completions:
    post:
      tags: [Apps]
      operationId: createChatCompletion
      summary: OpenAI-compatible chat completions; model "mia:default" is the user's active model
      description: >-
        Body and response follow the OpenAI Chat Completions format (including
        stream=true SSE). Mia extensions go in extra_body: mia.context,
        mia.tools, mia.budget. OpenAI SDKs do not send Idempotency-Key.
      x-mia-idempotency: exempt
      security:
        - miaOAuth: [llm.generate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model: {type: string, examples: ['mia:default']}
                messages: {type: array, minItems: 1, items: {type: object}}
                stream: {type: boolean}
                mia: {type: object}
      responses:
        '200':
          description: OpenAI-compatible completion or SSE chunks
          headers: *rid
          content:
            application/json:
              schema: {type: object}
            text/event-stream:
              schema: {type: string}
        default: *error
  /.well-known/oauth-authorization-server:
    get:
      tags: [Apps]
      operationId: getAuthorizationServerMetadata
      security: []
      responses:
        '200':
          description: RFC 8414 metadata (client_id_metadata_document_supported true, PKCE S256 only)
          headers: *rid
          content:
            application/json:
              schema: {type: object}
  /oauth/authorize:
    get:
      tags: [Apps]
      operationId: oauthAuthorize
      summary: OAuth 2.1 authorization endpoint; client_id is a Client ID Metadata Document URL
      security: []
      parameters:
        - {name: client_id, in: query, required: true, schema: {type: string, format: uri}}
        - {name: redirect_uri, in: query, required: true, schema: {type: string, format: uri}}
        - {name: response_type, in: query, required: true, schema: {type: string, enum: [code]}}
        - {name: scope, in: query, required: true, schema: {type: string}}
        - {name: state, in: query, required: true, schema: {type: string}}
        - {name: code_challenge, in: query, required: true, schema: {type: string}}
        - {name: code_challenge_method, in: query, required: true, schema: {type: string, enum: [S256]}}
        - {name: resource, in: query, required: false, schema: {type: string, format: uri}}
      responses:
        '302':
          description: Redirect to consent screen or back to redirect_uri
          headers: *rid
  /oauth/token:
    post:
      tags: [Apps]
      operationId: oauthToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id]
              properties:
                grant_type: {type: string, enum: [authorization_code, refresh_token]}
                client_id: {type: string, format: uri}
                code: {type: string}
                code_verifier: {type: string}
                redirect_uri: {type: string}
                refresh_token: {type: string}
      responses:
        '200':
          description: Short-lived access token and rotating refresh token
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, scope]
                properties:
                  access_token: {type: string}
                  token_type: {type: string, enum: [Bearer]}
                  expires_in: {type: integer}
                  refresh_token: {type: string}
                  scope: {type: string}
        '400':
          description: RFC 6749 error
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
                  error_description: {type: string}
  /oauth/revoke:
    post:
      tags: [Apps]
      operationId: oauthRevoke
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
                token_type_hint: {type: string, enum: [access_token, refresh_token]}
      responses:
        '200':
          description: Revoked (always 200 per RFC 7009)
          headers: *rid
  /mcp:
    post:
      tags: [Apps]
      operationId: miaMcpServer
      summary: Mia as a Streamable HTTP MCP server (2026-07-28) for Claude, ChatGPT, Cursor
      security:
        - miaOAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, description: JSON-RPC 2.0 request}
      responses:
        '200':
          description: JSON-RPC response or SSE stream
          headers: *rid
          content:
            application/json:
              schema: {type: object}
            text/event-stream:
              schema: {type: string}
        default: *error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    miaOAuth:
      type: oauth2
      description: «Войти через Mia» (ADR-0013). Public clients use PKCE; clients are identified by CIMD URLs.
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          refreshUrl: /oauth/token
          scopes:
            openid: Sign-in identity
            profile: Name
            email: Email
            llm.generate: Requests to the user's active model within an app budget
            memory.context: Core injects relevant memory into the app's model requests
            memory.suggest: Suggest facts (land as suggested)
            memory.read:profile: Read raw profile facts (logged)
            memory.read:work: Read raw work facts (logged)
            tools.use: Use installed plugins; narrowed as tools.use:<plugin_id>
            jobs: Create background jobs
            notify: Notify the user
            mia.install: Register the app as a Mia plugin (MCP server)
  headers:
    RequestId:
      description: Opaque correlation identifier
      schema: {type: string, minLength: 1, maxLength: 128}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique per user, endpoint and canonical mutation request
      schema: {type: string, minLength: 16, maxLength: 128}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string, minLength: 1, maxLength: 512}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    RunId:
      name: run_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PluginId:
      name: plugin_id
      in: path
      required: true
      schema: {type: string}
    InstallationId:
      name: installation_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ConnectionId:
      name: connection_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RecordId:
      name: fact_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PersonId:
      name: person_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    JobId:
      name: job_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ScheduleId:
      name: schedule_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Error:
      description: Stable public error envelope
      headers: *rid
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id, retryable]
          properties:
            code: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
            message: {type: string, minLength: 1, maxLength: 500}
            request_id: {type: string, minLength: 1, maxLength: 128}
            retryable: {type: boolean}
            details: {type: object}
    CreateRunRequest:
      type: object
      additionalProperties: false
      required: [profile, input]
      properties:
        profile: {type: string, enum: [voice, chat]}
        input:
          type: object
          additionalProperties: false
          required: [text]
          properties:
            text: {type: string, minLength: 1, maxLength: 16000}
        conversation_id: {type: string, format: uuid}
        device_id: {type: string, format: uuid}
        incognito: {type: boolean, default: false}
    Run:
      type: object
      required: [id, profile, status, created_at, events_url]
      properties:
        id: {type: string, format: uuid}
        profile: {type: string, enum: [voice, chat, job, app]}
        status: {type: string, enum: [running, waiting_approval, completed, failed, cancelled]}
        created_at: {type: string, format: date-time}
        events_url: {type: string}
        response: {$ref: '#/components/schemas/AssistantResponse'}
    CatalogEntry:
      type: object
      required: [plugin_id, version, manifest]
      properties:
        plugin_id: {type: string}
        version: {type: string}
        manifest: {$ref: '#/components/schemas/PluginManifest'}
    Installation:
      type: object
      required: [id, plugin_id, version, status]
      properties:
        id: {type: string, format: uuid}
        plugin_id: {type: string}
        version: {type: string}
        status: {type: string, enum: [active, needs_connection, needs_consent, disabled]}
        custom_url: {type: [string, 'null'], description: Set for «добавить свой MCP по URL»}
    CreateInstallationRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [plugin_id, version, tools_digest]
          properties:
            plugin_id: {type: string}
            version: {type: string}
            tools_digest: {type: string, description: Digest of tool descriptions the user consented to}
        - type: object
          additionalProperties: false
          required: [custom_mcp_url]
          properties:
            custom_mcp_url: {type: string, pattern: '^https://'}
    Connection:
      type: object
      required: [id, installation_id, status]
      properties:
        id: {type: string, format: uuid}
        installation_id: {type: string, format: uuid}
        status: {type: string, enum: [pending, connected, expired, revoked]}
        account_label: {type: [string, 'null']}
    Dashboard:
      type: object
      required: [expected_version, tiles]
      properties:
        expected_version: {type: integer, minimum: 0}
        tiles:
          type: array
          items:
            type: object
            required: [id, installation_id, tile_id, size, position]
            properties:
              id: {type: string, format: uuid}
              installation_id: {type: string, format: uuid}
              tile_id: {type: string}
              size: {type: string, enum: ['1x1', '2x1', '2x2', '4x2', '4x4']}
              position: {type: integer, minimum: 0}
    RunEvent: {$ref: 'run-events.schema.json'}
    AssistantResponse: {$ref: 'assistant-response.schema.json'}
    PluginManifest: {$ref: 'plugin-manifest.schema.json'}
    Approval: {$ref: 'approval.schema.json#/$defs/Approval'}
    ApprovalDecisionRequest: {$ref: 'approval.schema.json#/$defs/ApprovalDecisionRequest'}
    DeviceToolRegistration: {$ref: 'device-tools.schema.json#/$defs/DeviceToolRegistration'}
    DeviceToolResult: {$ref: 'device-tools.schema.json#/$defs/DeviceToolResult'}
    Fact: {$ref: 'memory.schema.json#/$defs/Fact'}
    Person: {$ref: 'memory.schema.json#/$defs/Person'}
    Preference: {$ref: 'memory.schema.json#/$defs/Preference'}
    MemorySuggestion: {$ref: 'memory.schema.json#/$defs/MemorySuggestion'}
    Job: {$ref: 'job.schema.json#/$defs/Job'}
    CreateJobRequest: {$ref: 'job.schema.json#/$defs/CreateJobRequest'}
    Schedule: {$ref: 'job.schema.json#/$defs/Schedule'}
    CreateScheduleRequest: {$ref: 'job.schema.json#/$defs/CreateScheduleRequest'}
    InboxItem: {$ref: 'job.schema.json#/$defs/InboxItem'}
