      operationId: telegramWebhook
      summary: Telegram Bot API webhook; authenticated only by the X-Telegram-Bot-Api-Secret-Token header (M41)
      security: []
      parameters:
        - {name: X-Telegram-Bot-Api-Secret-Token, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 256}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, description: Telegram Update}
      responses:
        '200':
          description: Update accepted (also when its handling failed, so Telegram does not retry)
          headers: *rid
          content:
            application/json:
              schema: {type: object, required: [ok], properties: {ok: {type: boolean}}}
        default: *error
  /v1/chat/completions:
    post:
      tags: [Apps]
      operationId: createChatCompletion
      summary: OpenAI-compatible chat completions; model "mia:default" is the user's active model
      description: >-
        Body and response follow the OpenAI Chat Completions format (including
        stream=true SSE). Mia extensions go in extra_body: mia.context,
        mia.tools, mia.budget. OpenAI SDKs do not send Idempotency-Key.
      x-mia-idempotency: exempt
      security:
        - miaOAuth: [llm.generate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model: {type: string, examples: ['mia:default']}
                messages: {type: array, minItems: 1, items: {type: object}}
                stream: {type: boolean}
                stream_options: {type: object}
                tools: {type: array, items: {type: object}}
                mia: {$ref: '#/components/schemas/MiaExtensions'}
      responses:
        '200':
          description: OpenAI-compatible completion or SSE chunks
          headers: *rid
          content:
            application/json:
              schema: {type: object}
            text/event-stream:
              schema: {type: string}
        default: *error
  /.well-known/oauth-authorization-server:
    get:
      tags: [Apps]
      operationId: getAuthorizationServerMetadata
      security: []
      responses:
        '200':
          description: RFC 8414 metadata (client_id_metadata_document_supported true, PKCE S256 only)
          headers: *rid
          content:
            application/json:
              schema: {type: object}
  /oauth/authorize:
    get:
      tags: [Apps]
      operationId: oauthAuthorize
      summary: OAuth 2.1 authorization endpoint; client_id is a Client ID Metadata Document URL
      security: []
      parameters:
        - {name: client_id, in: query, required: true, schema: {type: string, format: uri}}
        - {name: redirect_uri, in: query, required: true, schema: {type: string, format: uri}}
        - {name: response_type, in: query, required: true, schema: {type: string, enum: [code]}}
        - {name: scope, in: query, required: true, schema: {type: string}}
        - {name: state, in: query, required: true, schema: {type: string}}
        - {name: code_challenge, in: query, required: true, schema: {type: string}}
        - {name: code_challenge_method, in: query, required: true, schema: {type: string, enum: [S256]}}
        - {name: resource, in: query, required: false, schema: {type: string, format: uri}}
      responses:
        '302':
          description: Redirect to consent screen or back to redirect_uri
          headers: *rid
  /oauth/token:
    post:
      tags: [Apps]
      operationId: oauthToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id]
              properties:
                grant_type: {type: string, enum: [authorization_code, refresh_token]}
                client_id: {type: string, format: uri}
                code: {type: string}
                code_verifier: {type: string}
                redirect_uri: {type: string}
                refresh_token: {type: string}
      responses:
        '200':
          description: Short-lived access token and rotating refresh token
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, scope]
                properties:
                  access_token: {type: string}
                  token_type: {type: string, enum: [Bearer]}
                  expires_in: {type: integer}
                  refresh_token: {type: string}
                  scope: {type: string}
                  id_token: {type: string, description: ES256 OIDC ID token when openid was granted (M50)}
        '400':
          description: RFC 6749 error
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
                  error_description: {type: string}
  /oauth/revoke:
    post:
      tags: [Apps]
      operationId: oauthRevoke
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
                token_type_hint: {type: string, enum: [access_token, refresh_token]}
      responses:
        '200':
          description: Revoked (always 200 per RFC 7009)
          headers: *rid
  /mcp:
    post:
      tags: [Apps]
      operationId: miaMcpServer
      summary: Mia as a Streamable HTTP MCP server (2026-07-28) for Claude, ChatGPT, Cursor
      security:
        - miaOAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, description: JSON-RPC 2.0 request}
      responses:
        '200':
          description: JSON-RPC response or SSE stream
          headers: *rid
          content:
            application/json:
              schema: {type: object}
            text/event-stream:
              schema: {type: string}
        default: *error
  /v1/responses:
    post:
      tags: [Apps]
      operationId: createResponse
      summary: OpenAI-compatible Responses API; model "mia:default" (M50)
      description: >-
        Body and response follow the OpenAI Responses format (input string or items,
        instructions, function tools, stream=true SSE with response.* events). Same Mia
        extensions as chat completions in the mia field; runs as Run(app).
      x-mia-idempotency: exempt
      security:
        - miaOAuth: [llm.generate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, input]
              properties:
                model: {type: string, examples: ['mia:default']}
                input: {oneOf: [{type: string}, {type: array, items: {type: object}}]}
                instructions: {type: string}
                tools: {type: array, items: {type: object}}
                stream: {type: boolean}
                max_output_tokens: {type: integer, minimum: 1}
                mia: {$ref: '#/components/schemas/MiaExtensions'}
      responses:
        '200':
          description: OpenAI-compatible response object (+ mia {run_id, cost_usd}) or SSE events
          headers: *rid
          content:
            application/json:
              schema: {type: object}
            text/event-stream:
              schema: {type: string}
        default: *error
  /v1/models:
    get:
      tags: [Apps]
      operationId: listAppModels
      summary: OpenAI-compatible model list; only mia:default (M50)
      security:
        - miaOAuth: [llm.generate]
      responses:
        '200':
          description: Models
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: {type: string, enum: [list]}
                  data: {type: array, items: {type: object}}
        default: *error
  /v1/oauth/requests/{handle}:
    get:
      tags: [Apps]
      operationId: getAuthorizationRequest
      summary: Consent screen data; the first signed-in viewer owns the request (M50)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - {name: handle, in: path, required: true, schema: {type: string, minLength: 8, maxLength: 80}}
      responses:
        '200':
          description: Client, requested scopes with Russian texts, defaults for categories and limit
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthorizationRequestView'}
        default: *error
  /v1/oauth/requests/{handle}/decision:
    post:
      tags: [Apps]
      operationId: decideAuthorizationRequest
      summary: Approve or deny; returns where the browser goes next (code or error redirect)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - {name: handle, in: path, required: true, schema: {type: string, minLength: 8, maxLength: 80}}
        - *idem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              additionalProperties: false
              properties:
                decision: {type: string, enum: [approve, deny]}
                scopes: {type: array, items: {type: string}, maxItems: 32, description: Subset of the requested scopes}
                memory_categories:
                  type: array
                  items: {type: string, enum: [profile, work, home, interests, other]}
                monthly_limit_usd: {type: number, minimum: 0}
      responses:
        '200':
          description: Same Idempotency-Key replays the first answer
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [redirect_to]
                properties:
                  redirect_to: {type: string, format: uri}
        default: *error
  /v1/apps:
    get:
      tags: [Apps]
      operationId: listConnectedApps
      summary: «Подключённые приложения» with this month's spend (M50)
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Active grants
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ConnectedApp'}}
        default: *error
  /v1/apps/{grant_id}:
    get:
      tags: [Apps]
      operationId: getConnectedApp
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - {name: grant_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: One grant
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectedApp'}
        default: *error
    patch:
      tags: [Apps]
      operationId: updateConnectedApp
      summary: Change the monthly limit or memory categories, or drop scopes
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - {name: grant_id, in: path, required: true, schema: {type: string, format: uuid}}
        - *idem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                monthly_limit_usd: {type: number, minimum: 0}
                memory_categories: {type: array, items: {type: string}}
                remove_scopes: {type: array, items: {type: string}, maxItems: 32}
      responses:
        '200':
          description: Updated grant
          headers: *rid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectedApp'}
        default: *error
    delete:
      tags: [Apps]
      operationId: revokeConnectedApp
      summary: Disconnect the app; every token of the grant stops working at once
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - {name: grant_id, in: path, required: true, schema: {type: string, format: uuid}}
        - *idem
      responses:
        '204':
          description: Revoked (repeating is a no-op)
          headers: *rid
        default: *error
  /v1/apps/{grant_id}/usage:
    get:
      tags: [Apps]
      operationId: getConnectedAppUsage
      summary: Spend journal (provider cost or a token-based estimate)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - {name: grant_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Newest first
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [month_start, month_spend_usd, monthly_limit_usd, items]
                properties:
                  month_start: {type: string, format: date-time}
                  month_spend_usd: {type: string}
                  monthly_limit_usd: {type: string}
                  items:
                    type: array
                    items:
                      type: object
                      required: [at, surface, input_tokens, output_tokens, cost_usd, estimated]
                      properties:
                        at: {type: string, format: date-time}
                        surface: {type: string, enum: [chat_completions, responses, mcp]}
                        run_id: {type: [string, 'null'], format: uuid}
                        input_tokens: {type: integer}
                        output_tokens: {type: integer}
                        cost_usd: {type: string}
                        estimated: {type: boolean}
        default: *error
  /v1/apps/{grant_id}/access-log:
    get:
      tags: [Apps]
      operationId: getConnectedAppAccessLog
      summary: Memory access log entries of this app (actor app)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - {name: grant_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Newest first; same item shape as /v1/memory/access-log
          headers: *rid
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {type: object}}
        default: *error
  /oauth/userinfo:
    get:
      tags: [Apps]
      operationId: oauthUserinfo
      summary: OIDC userinfo; sub is pairwise per client host
      security:
        - miaOAuth: [openid]
      responses:
        '200':
          description: sub (+ name, picture, locale, zoneinfo with profile; email with email)
          headers: *rid
          content:
            application/json:
              schema: {type: object, required: [sub], properties: {sub: {type: string}}}
        default: *error
  /oauth/jwks.json:
    get:
      tags: [Apps]
      operationId: oauthJwks
      summary: Public ES256 key of ID tokens
      security: []
      responses:
        '200':
          description: JWK Set
          headers: *rid
          content:
            application/json:
              schema: {type: object}
  /.well-known/openid-configuration:
    get:
      tags: [Apps]
      operationId: getOpenIdConfiguration
      summary: Same document as /.well-known/oauth-authorization-server
      security: []
      responses:
        '200':
          description: OIDC discovery metadata
          headers: *rid
          content:
            application/json:
              schema: {type: object}
  /.well-known/oauth-protected-resource:
    get:
      tags: [Apps]
      operationId: getApiResourceMetadata
      summary: RFC 9728 metadata of the API resource
      security: []
      responses:
        '200':
          description: resource = issuer
          headers: *rid
          content:
            application/json:
              schema: {type: object}
  /.well-known/oauth-protected-resource/mcp:
    get:
      tags: [Apps]
      operationId: getMcpResourceMetadata
      summary: RFC 9728 metadata of /mcp (named in the 401 WWW-Authenticate challenge)
      security: []
      responses:
        '200':
          description: resource = <issuer>/mcp
          headers: *rid
          content:
            application/json:
              schema: {type: object}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: mia_session
      description: >-
        Web session (HttpOnly, SameSite=Strict), an alternative to bearerAuth for the first-party
        web client. Mutations must be same-origin; otherwise 403 permission_denied.
    miaOAuth:
      type: oauth2
      description: «Войти через Mia» (ADR-0013). Public clients use PKCE; clients are identified by CIMD URLs.
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          refreshUrl: /oauth/token
          scopes:
            openid: Sign-in identity
            profile: Name
            email: Email
            llm.generate: Requests to the user's active model within an app budget
            memory.context: Core injects relevant memory into the app's model requests
            memory.suggest: Suggest facts (land as suggested)
            memory.read:profile: Read raw profile facts (logged)
            memory.read:work: Read raw work facts (logged)
            memory.read:home: Read raw home facts (logged)
            memory.read:health: Read raw health facts (logged)
            memory.read:finance: Read raw finance facts (logged)
            memory.read:interests: Read raw interests facts (logged)
            memory.read:other: Read raw other facts and people names (logged)
            tools.use: Use installed plugins; narrowed as tools.use:<plugin_id>
            jobs: Create background jobs
            notify: Notify the user
            mia.install: Register the app as a Mia plugin (MCP server)
  headers:
    RequestId:
      description: Opaque correlation identifier
      schema: {type: string, minLength: 1, maxLength: 128}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique per user, endpoint and canonical mutation request
      schema: {type: string, minLength: 16, maxLength: 128}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string, minLength: 1, maxLength: 512}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    RunId:
      name: run_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PluginId:
      name: plugin_id
      in: path
      required: true
      schema: {type: string}
    InstallationId:
      name: installation_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ConnectionId:
      name: connection_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RecordId:
      name: fact_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PersonId:
      name: person_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    JobId:
      name: job_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ScheduleId:
      name: schedule_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Error:
      description: Stable public error envelope
      headers: *rid
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    MiaExtensions:
      type: object
      description: Mia extensions of the OpenAI-compatible endpoints (extra_body={"mia":{...}}), M50
      additionalProperties: false
      properties:
        context: {type: boolean, default: true, description: Inject memory when the token has memory.context}
        tools:
          type: array
          items: {type: string}
          description: Plugin ids (or "*") Mia may use for this request; needs tools.use[:<plugin_id>]
        budget:
          type: object
          additionalProperties: false
          properties:
            max_usd: {type: number, exclusiveMinimum: 0}
    AuthorizationRequestView:
      type: object
      required: [client, scopes, memory_categories, monthly_limit_usd, max_monthly_limit_usd, existing_grant, expires_at]
      properties:
        client:
          type: object
          required: [client_id, name, redirect_host]
          properties:
            client_id: {type: string, format: uri}
            name: {type: string}
            client_uri: {type: [string, 'null']}
            logo_uri: {type: [string, 'null']}
            redirect_host: {type: string}
        scopes:
          type: array
          items:
            type: object
            required: [scope, title, description, sensitive, available]
            properties:
              scope: {type: string}
              title: {type: string}
              description: {type: string}
              sensitive: {type: boolean}
              available: {type: boolean, description: false while no app-facing endpoint exists (jobs, notify, mia.install)}
        memory_categories: {type: array, items: {type: string}}
        monthly_limit_usd: {type: string}
        max_monthly_limit_usd: {type: string}
        existing_grant: {type: boolean}
        expires_at: {type: string, format: date-time}
    ConnectedApp:
      type: object
      required: [id, client_id, client_name, scopes, memory_categories, monthly_limit_usd, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        client_id: {type: string, format: uri}
        client_name: {type: string}
        client_uri: {type: [string, 'null']}
        logo_uri: {type: [string, 'null']}
        scopes: {type: array, items: {type: string}}
        memory_categories: {type: array, items: {type: string}}
        monthly_limit_usd: {type: string}
        month_spend_usd: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id, retryable]
          properties:
            code: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
            message: {type: string, minLength: 1, maxLength: 500}
            request_id: {type: string, minLength: 1, maxLength: 128}
            retryable: {type: boolean}
            details: {type: object}
    CreateRunRequest:
      type: object
      additionalProperties: false
      required: [profile, input]
      properties:
        profile: {type: string, enum: [voice, chat]}
        input:
          type: object
          additionalProperties: false
          required: [text]
          properties:
            text: {type: string, minLength: 1, maxLength: 16000}
        conversation_id: {type: string, format: uuid}
        device_id: {type: string, format: uuid}
        incognito: {type: boolean, default: false}
    Run:
      type: object
      required: [id, profile, status, created_at, events_url]
      properties:
        id: {type: string, format: uuid}
        profile: {type: string, enum: [voice, chat, job, app]}
        status:
          type: string
          enum: [running, waiting_approval, cancel_requested, completed, failed, cancelled]
        created_at: {type: string, format: date-time}
        events_url: {type: string}
        response: {$ref: '#/components/schemas/AssistantResponse'}
        model: {type: string, description: Resolved model reference (M12)}
        conversation_id: {type: string, format: uuid, description: Feed the run writes to; absent for incognito}
        steps: {type: integer, minimum: 0}
        tool_calls: {type: integer, minimum: 0}
        error: {$ref: 'common.schema.json#/$defs/publicError'}
        cancel_reason: {type: string, enum: [user, client_disconnected, budget_exceeded, superseded]}
        finished_at: {type: string, format: date-time}
    FeedItem:
      type: object
      required: [id, role, source, text, display, run_id, created_at]
      properties:
        id: {type: string, format: uuid}
        role: {type: string, enum: [user, assistant]}
        source:
          type: string
          enum: [run_voice, run_chat, run_job, run_app, android_text, android_voice]
          description: Where the message came from; run_* messages carry run_id
        text: {type: string, description: Message text (user input, or the answer's markdown/speech)}
        display:
          type: [object, 'null']
          description: >-
            The answer's display exactly as in AssistantResponse.display
            (assistant-response.schema.json); null for user messages and plain answers
        run_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
    FeedPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/FeedItem'}}
        next_cursor: {type: [string, 'null'], description: Pass as before; null when there is nothing older}
    CatalogEntry:
      type: object
      required: [plugin_id, version, manifest]
      properties:
        plugin_id: {type: string}
        version: {type: string}
        manifest: {$ref: '#/components/schemas/PluginManifest'}
        name: {type: string}
        description: {type: string}
        category: {type: string, enum: [work, productivity, communication, knowledge, home, utilities, fun]}
        author: {type: [string, 'null']}
        kind: {type: string, enum: [builtin, remote, declarative]}
        tagline: {type: [string, 'null'], description: Showcase line (store_meta; not part of mia.json)}
        color: {type: [string, 'null']}
        art: {type: [string, 'null']}
        featured: {type: boolean}
        rating:
          type: object
          required: [average, count]
          properties:
            average: {type: [number, 'null']}
            count: {type: integer, minimum: 0}
        installs: {type: integer, minimum: 0}
        icon_url: {type: [string, 'null']}
        screenshots: {type: array, items: {type: string}}
        published_at: {type: string, format: date-time}
    CatalogEntryDetail:
      allOf:
        - {$ref: '#/components/schemas/CatalogEntry'}
        - type: object
          required: [versions, consent]
          properties:
            versions: {type: array, items: {type: string}, description: 'Published versions, newest first'}
            consent: {$ref: '#/components/schemas/Consent'}
    Consent:
      type: object
      required: [plugin_id, version, tools_digest, tools, grants, network, public_web, llm, memory, notify, schedules, device_tools, requires_connection]
      properties:
        plugin_id: {type: string}
        version: {type: string}
        tools_digest: {type: string, description: Echo it in the install request}
        tools:
          type: array
          items:
            type: object
            required: [name, description, risk, voice]
            properties:
              name: {type: string}
              description: {type: string}
              risk: {type: string, enum: [read, write_reversible, write_external]}
              voice: {type: boolean}
        grants:
          type: array
          description: >-
            Grant vocabulary (OI-M13-002): tools.read | tools.write_reversible | tools.write_external |
            network:<host> | network.public_web | llm.generate | memory.context | memory.suggest |
            memory.read:<scope> | notify | schedules. Echo every id in the install request.
          items:
            type: object
            required: [id, text]
            properties:
              id: {type: string}
              text: {type: string}
        network: {type: array, items: {type: string}}
        public_web: {type: boolean}
        llm:
          type: object
          required: [via_host, monthly_budget_usd]
          properties:
            via_host: {type: boolean}
            monthly_budget_usd: {type: [number, 'null']}
        memory: {type: array, items: {type: string}}
        notify: {type: boolean}
        schedules: {type: boolean}
        device_tools: {type: array, items: {type: string}}
        requires_connection: {type: boolean}
        stores_state: {type: boolean}
    InstallRequest:
      type: object
      additionalProperties: false
      required: [version, tools_digest, grants]
      properties:
        version: {type: string}
        tools_digest: {type: string}
        grants: {type: array, maxItems: 128, items: {type: string}}
    UpgradeRequest:
      type: object
      additionalProperties: false
      required: [expected_version, version, tools_digest, grants]
      properties:
        expected_version: {type: integer, minimum: 0, description: state_version of the installation}
        version: {type: string}
        tools_digest: {type: string}
        grants: {type: array, maxItems: 128, items: {type: string}}
    UpdateInfo:
      type: object
      required: [installation_id, plugin_id, installed_version, latest_version, update_available, added_grants, removed_grants, digest_changed, consent]
      properties:
        installation_id: {type: string, format: uuid}
        plugin_id: {type: string}
        installed_version: {type: string}
        latest_version: {type: string}
        update_available: {type: boolean}
        added_grants: {type: array, items: {type: string}}
        removed_grants: {type: array, items: {type: string}}
        digest_changed: {type: boolean}
        consent:
          oneOf:
            - {$ref: '#/components/schemas/Consent'}
            - {type: 'null'}
    DiscoverResult:
      type: object
      required: [installation_id, state, tools, tools_digest, grants, host]
      properties:
        installation_id: {type: string, format: uuid}
        state: {type: string, enum: [needs_connection, ready]}
        tools:
          type: array
          items:
            type: object
            required: [name, description, risk]
            properties:
              name: {type: string}
              description: {type: string}
              risk: {type: string, enum: [write_external]}
        tools_digest: {type: [string, 'null']}
        grants:
          type: array
          items:
            type: object
            required: [id, text]
            properties:
              id: {type: string}
              text: {type: string}
        host: {type: string}
        skipped_tools: {type: array, items: {type: string}, description: Tool names the manifest grammar cannot hold; Mia does not offer them}
    ReviewList:
      type: object
      required: [items, rating]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, plugin_id, rating, text, author, mine, updated_at]
            properties:
              id: {type: string, format: uuid}
              plugin_id: {type: string}
              rating: {type: integer, minimum: 1, maximum: 5}
              text: {type: string}
              author: {type: string, description: First name only}
              mine: {type: boolean}
              updated_at: {type: string, format: date-time}
        rating:
          type: object
          required: [average, count]
          properties:
            average: {type: [number, 'null']}
            count: {type: integer, minimum: 0}
    Installation:
      type: object
      required: [id, plugin_id, version, status]
      properties:
        id: {type: string, format: uuid}
        plugin_id: {type: string}
        version: {type: string}
        status: {type: string, enum: [active, needs_connection, needs_consent, disabled]}
        custom_url: {type: [string, 'null'], description: Set for «добавить свой MCP по URL»}
        source: {type: string, enum: [catalog, custom, legacy_web]}
        grants: {type: array, items: {type: string}, description: Consented grants (see Consent.grants)}
        tools_digest: {type: [string, 'null']}
        state_version: {type: integer, minimum: 0, description: Send back as expected_version}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CreateInstallationRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [plugin_id, version, tools_digest]
          properties:
            plugin_id: {type: string}
            version: {type: string}
            tools_digest: {type: string, description: Digest of tool descriptions the user consented to}
        - type: object
          additionalProperties: false
          required: [custom_mcp_url]
          properties:
            custom_mcp_url: {type: string, pattern: '^https://'}
    Connection:
      type: object
      required: [id, installation_id, status]
      properties:
        id: {type: string, format: uuid}
        installation_id: {type: string, format: uuid}
        plugin_id: {type: string}
        status: {type: string, enum: [pending, connected, expired, revoked]}
        account_label: {type: [string, 'null']}
        scopes: {type: [string, 'null']}
    Workspace:
      type: object
      required: [id, name, owner_user_id, layout_version]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        owner_user_id: {type: string, format: uuid}
        layout_version: {type: integer, minimum: 0}
    PluginState:
      type: object
      required: [plugin_id, data, state_version]
      properties:
        plugin_id: {type: string}
        data: {type: object}
        state_version: {type: integer, minimum: 0}
    TilePlacement:
      type: object
      required: [size, position]
      properties:
        size: {type: string, enum: ['1x1', '2x1', '2x2', '4x2', '4x4']}
        position: {type: integer, minimum: 0}
    DashboardTile:
      type: object
      required: [id, installation_id, tile_id, size, position]
      properties:
        id: {type: string, format: uuid}
        installation_id: {type: string, format: uuid}
        tile_id: {type: string}
        size: {type: string, enum: ['1x1', '2x1', '2x2', '4x2', '4x4'], description: Desktop size}
        position: {type: integer, minimum: 0, description: Desktop position}
        mobile: {$ref: '#/components/schemas/TilePlacement'}
        settings: {type: object}
        state_version: {type: integer, minimum: 0}
    Dashboard:
      type: object
      required: [expected_version, tiles]
      properties:
        expected_version: {type: integer, minimum: 0}
        tiles:
          type: array
          items: {$ref: '#/components/schemas/DashboardTile'}
    TileDocument:
      type: object
      required: [installation_id, plugin_id, tile_id, resource_uri, html, csp, sizes, mobile, refresh, tools]
      properties:
        installation_id: {type: string, format: uuid}
        plugin_id: {type: string}
        tile_id: {type: string}
        title: {type: [string, 'null']}
        resource_uri: {type: string, pattern: '^ui://'}
        html: {type: string, description: Full document; the host puts it into a sandboxed iframe (allow-scripts only)}
        csp: {type: string, description: The Content-Security-Policy already inside html}
        sizes: {type: array, items: {type: string, enum: ['1x1', '2x1', '2x2', '4x2', '4x4']}}
        mobile: {type: string, enum: [card, tile, hidden]}
        refresh:
          oneOf:
            - {type: 'null'}
            - type: object
              required: [tool, every_seconds]
              properties:
                tool: {type: string}
                every_seconds: {type: integer, minimum: 30}
        tools: {type: array, items: {type: string}, description: Local names of the tools the tile may call (no write_external)}
    TileToolResult:
      type: object
      required: [status, is_error, content, structured_content, error_code]
      properties:
        status: {type: string, enum: [succeeded, failed, approval_required, denied, expired, uncertain, cancelled]}
        is_error: {type: boolean}
        content: {type: string}
        structured_content: {type: [object, 'null']}
        error_code: {type: [string, 'null']}
    ModelConnection:
      type: object
      required: [id, provider, label, model, capability, has_key, status, is_primary, verified]
      properties:
        id: {type: string, format: uuid}
        provider: {type: string}
        label: {type: string}
        model: {type: string}
        base_url: {type: [string, 'null']}
        capability: {type: string, enum: [tools, chat_only]}
        has_key: {type: boolean}
        key_last4: {type: [string, 'null']}
        status: {type: string, enum: [active, paused, needs_reauth]}
        paused_until: {type: [string, 'null'], format: date-time}
        is_primary: {type: boolean}
        verified: {type: boolean}
        last_tested_at: {type: [string, 'null'], format: date-time}
        last_test_ok: {type: [boolean, 'null']}
        last_test_error_code: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
    RunEvent: {$ref: 'run-events.schema.json'}
    AssistantResponse: {$ref: 'assistant-response.schema.json'}
    PluginManifest: {$ref: 'plugin-manifest.schema.json'}
    Approval: {$ref: 'approval.schema.json#/$defs/Approval'}
    ApprovalDecisionRequest: {$ref: 'approval.schema.json#/$defs/ApprovalDecisionRequest'}
    DeviceToolRegistration: {$ref: 'device-tools.schema.json#/$defs/DeviceToolRegistration'}
    DeviceToolResult: {$ref: 'device-tools.schema.json#/$defs/DeviceToolResult'}
    Fact: {$ref: 'memory.schema.json#/$defs/Fact'}
    Person: {$ref: 'memory.schema.json#/$defs/Person'}
    Preference: {$ref: 'memory.schema.json#/$defs/Preference'}
    MemorySuggestion: {$ref: 'memory.schema.json#/$defs/MemorySuggestion'}
    MemorySettings:
      type: object
      required: [autosave_categories, history_retention]
      properties:
        autosave_categories: {type: array, items: {type: string}}
        history_retention: {type: string, enum: ['30d', '1y', forever, none]}
    MemoryExport:
      type: object
      required: [format, exported_at, facts, people, preferences]
      properties:
        format: {const: mia.memory.v1}
        exported_at: {type: string, format: date-time}
        facts: {type: array, items: {$ref: '#/components/schemas/Fact'}}
        people: {type: array, items: {$ref: '#/components/schemas/Person'}}
        preferences: {type: array, items: {$ref: '#/components/schemas/Preference'}}
    Job: {$ref: 'job.schema.json#/$defs/Job'}
    CreateJobRequest: {$ref: 'job.schema.json#/$defs/CreateJobRequest'}
    Schedule: {$ref: 'job.schema.json#/$defs/Schedule'}
    CreateScheduleRequest: {$ref: 'job.schema.json#/$defs/CreateScheduleRequest'}
    InboxItem: {$ref: 'job.schema.json#/$defs/InboxItem'}
