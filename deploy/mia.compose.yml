# Hosted Mia on the shared mindmapgen.xyz server (M62-T1): API + worker + PostgreSQL + Redis.
# Compose project "mia", directory /opt/mia. Only the API is published, on 127.0.0.1:8004 (nginx
# location /mia/). Secrets live in /opt/mia/secrets/*.env (root, 0600), generated on the server by
# release-mia.sh; values never appear here. Limits are sized for a 2 GB VM shared by four apps.
x-app: &app
  image: mia:latest
  restart: unless-stopped
  env_file: [secrets/app.env] # DATABASE_URL, REDIS_URL, AUTH_JWT_SECRET, CREDENTIALS_MASTER_KEY*
  environment: &app-env
    APP_ENV: production
    LOG_LEVEL: INFO
    PUBLIC_BASE_URL: https://mindmapgen.xyz/mia
    # Public Web client ID (Google Identity Services); the web bundle carries the same value.
    GOOGLE_CLIENT_ID: 806288812204-oobsnndkd9unnmn2rclisebkfnt8n63b.apps.googleusercontent.com
    # A cloud server cannot receive the 127.0.0.1 redirect: the user pastes it (M62-T1).
    CHATGPT_PLAN_LOOPBACK_LISTENER: "false"
    STORE_PACKAGES_DIR: /tmp/mia-packages
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: &logging
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  mia:
    <<: *app
    container_name: mia
    ports:
      - "127.0.0.1:8004:8000"
    environment:
      <<: *app-env
      WEB_DIST_DIR: /app/web/dist
      ANDROID_APK_PATH: /releases/mia.apk
      # Docker networks, the host nginx and the provider's TLS gateway in front of it.
      FORWARDED_ALLOW_IPS: "172.16.0.0/12,127.0.0.1,10.0.18.240"
    volumes:
      - ./releases:/releases:ro
    mem_limit: 384m

  worker:
    <<: *app
    container_name: mia_worker
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true
    stop_grace_period: 30s
    mem_limit: 256m

  postgres:
    image: postgres:16-alpine
    container_name: mia_postgres
    restart: unless-stopped
    env_file: [secrets/postgres.env] # POSTGRES_PASSWORD
    environment:
      POSTGRES_DB: mia
      POSTGRES_USER: mia
    # Small-VM tuning: the dataset is one user's chat, memory and plugin state.
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - effective_cache_size=96MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - max_connections=50
      - -c
      - wal_buffers=1MB
    volumes:
      - ./postgres:/var/lib/postgresql/data
    shm_size: 64m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mia -d mia"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    mem_limit: 192m

  redis:
    image: redis:7-alpine
    container_name: mia_redis
    restart: unless-stopped
    env_file: [secrets/redis.env] # REDIS_PASSWORD
    # Only short-lived keys (nonces, rate counters, hand-off codes): no persistence.
    command:
      - sh
      - -c
      - exec redis-server --save '' --appendonly no --maxmemory 32mb --maxmemory-policy volatile-ttl --requirepass "$$REDIS_PASSWORD"
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    mem_limit: 64m
