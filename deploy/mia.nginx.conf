# Included by the existing mindmapgen.xyz server block (M62-T1). Other apps stay unchanged.
# The server block already sets Host, X-Forwarded-For/Proto, HTTP/1.1 and upgrade headers.
location = /mia { return 301 /mia/; }
location /mia/ {
    # The prefix is stripped: the app sees /v1/..., /health/..., /oauth/..., web pages.
    proxy_pass http://127.0.0.1:8004/;
    # JSON APIs and memory import; the APK is a download, not an upload.
    client_max_body_size 2m;
    # Chat runs last up to 150 s and their SSE streams stay open; keep them unbuffered.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
}
# RFC 8414 / RFC 9728 put the metadata of an issuer or resource with a path at the host root:
# issuer https://mindmapgen.xyz/mia, resources https://mindmapgen.xyz/mia and .../mia/mcp.
location = /.well-known/oauth-authorization-server/mia {
    proxy_pass http://127.0.0.1:8004/.well-known/oauth-authorization-server;
}
location = /.well-known/openid-configuration/mia {
    proxy_pass http://127.0.0.1:8004/.well-known/openid-configuration;
}
location = /.well-known/oauth-protected-resource/mia {
    proxy_pass http://127.0.0.1:8004/.well-known/oauth-protected-resource;
}
location = /.well-known/oauth-protected-resource/mia/mcp {
    proxy_pass http://127.0.0.1:8004/.well-known/oauth-protected-resource/mcp;
}
