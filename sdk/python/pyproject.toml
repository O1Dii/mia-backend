[project]
name = "mia-sdk"
version = "0.1.0"
description = "Sign in with Mia and the Mia API (OpenAI-compatible completions, runs) for Python apps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
openai = ["openai>=1.50"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mia_sdk"]
